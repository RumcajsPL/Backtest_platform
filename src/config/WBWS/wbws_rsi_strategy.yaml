strategy:
  name: WBWS strategy with RSI Filter
  description: We Buy/We Sell Trigger combined with RSI signal validation
  version: 1.2.0
  author: Backtest Platform
  created: '2025-12-17'
  updated: '2025-12-30'
asset:
  symbol: DEUIDXEUR
  name: DAX 40 Index
  exchange: EUREX
  currency: EUR
data:
  file: data/processed/ohlcv/DEUIDXEUR_1min_20240101_20260104.csv
  file_htf: data/processed/ohlcv/DEUIDXEUR_1H_20230101_20260104.csv
  file_ltf: data/processed/ohlcv/DEUIDXEUR_1s_20240101_20260104.csv
  format: csv
  date_range:
    start: '2025-09-14 08:00:00'   #'2025-09-14 08:00:00'
    end: '2025-12-17 21:00:00'
  validation:
    check_ohlc: true
    check_gaps: false
    max_price_move: 0.1
indicator:
  name: WBWS_Trigger
  htf_period: 1H
filters:
  rsi_filter:
    enabled: true
    length: 14
    overbought: 70
    oversold: 30
trade_management:
  time_filter:
    enabled: true
    session_start:
      hour: 8
      minute: 30
    session_end:
      hour: 20
      minute: 30
  position_control:
    close_on_opposite: false
    pyramiding_enabled: false
  opposite_signal:
    enabled: false
  sl_tp:
    enabled: true
    atr_length: 14
    sl_multiplier: 1.4
    risk_to_reward_ratio: 5.7
  risk_management:
    enabled: true
    max_risk_percentile: 0.0016
    allow_exceed_limit: false
  spread:
    enabled: true
    required: false
    apply_to_long: true
    apply_to_short: true
    log_spread_impact: true
# =============================================================================
# EXECUTION MODE CONFIGURATION (NEW)
# =============================================================================
execution:
  mode: "core"  # Options: "core" | "debug"
  # 
  # "core"  - Optimized for pipeline orchestrator (45-65% faster)
  #           - Skips progressive tracking
  #           - Skips detailed metrics calculation
  #           - Skips CSV generation
  #           - Generates minimal JSON report (Part 1 only)
  #
  # "debug" - Full detailed tracking and analysis (default if not specified)
  #           - Generates all CSV files
  #           - Calculates all detailed metrics
  #           - Generates complete JSON report (Part 1 + Part 2)
  #           - Shows cache statistics
  #
# =============================================================================
# OUTPUT CONFIGURATION (AUTO-CONFIGURED BY MODE)
# =============================================================================
# Note: These settings are automatically set based on execution.mode
# You can override them manually if needed
output:
  # Progressive tracking (signal-by-signal detailed analysis)
  enable_progressive_tracking: false  # true in debug, false in core
  # Detailed metrics (spread analysis, monthly performance, etc.)
  enable_detailed_metrics: false      # true in debug, false in core
  # CSV file generation
  save_signals_csv: false             # true in debug, false in core
  # Cache statistics collection and display
  enable_cache_stats: false           # true in debug, false in core
  # Output directories (same in both modes)
  outputs_dir: "outputs"
  reports_dir: "reports/WBWS"
  signals_dir: "signals/strategy"
  verbose: false