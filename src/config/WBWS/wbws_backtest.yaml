# ============================================================
# WBWS BACKTEST OPTIMIZATION CONFIGURATION
# ============================================================

backtest:
  mode: full_pipeline        # random -> GA -> WFO -> MonteCarlo
  output_compare: true
  max_parallel_runs: 4
  save_all_intermediate: true

# ============================================================
# GLOBAL CONSTRAINTS (HARD FILTERS)
# ============================================================

constraints:
  min_winrate: 0.3
  # max_drawdown: 0.25 - deactivated as not yet available
  # max_losing_streak: 12 - deactivated as not yet available
  min_trades_per_day: 4
  min_expectancy: 0.1
  min_profit_factor: 1.1

# ============================================================
# FITNESS FUNCTION (WHAT "GOOD" MEANS)
# ============================================================

fitness:
  weights:
    net_pnl: 0.30
    expectancy: 0.30
    drawdown: -0.20
    losing_streak: -0.10
    winrate: 0.10
    
# ==========================================================================================================
# RANDOM SEARCH CONFIGURATION
# ==========================================================================================================

random_search:
  enabled: true
  samples_per_zone: 150
  method: latin_hypercube

# ============================================================
# GENETIC ALGORITHM CONFIGURATION
# ============================================================

genetic:
  enabled: true
  population_size: 40
  generations: 15
  mutation_rate: 0.15
  crossover_rate: 0.6
  elite_fraction: 0.2
  tournament_k: 3

# ============================================================
# WALK-FORWARD OPTIMIZATION (WFO) CONFIGURATION
# ============================================================

walk_forward:
  enabled: true
  method: fixed_windows      # options: fixed_windows, rolling_days
  windows:
    - train: ["2024-01-01", "2024-06-30"]
      test:  ["2024-07-01", "2024-08-31"]
    - train: ["2024-03-01", "2024-08-31"]
      test:  ["2024-09-01", "2024-10-31"]
    - train: ["2024-05-01", "2024-10-31"]
      test:  ["2024-11-01", "2024-12-31"]
  
  # Alternative rolling days approach (kept for compatibility)
  train_days: 20
  test_days: 5

# ============================================================
# MONTE CARLO STRESS TESTING CONFIGURATION
# ============================================================

monte_carlo:
  enabled: true
  iterations: 1000
  initial_balance: 10000
  
  # Noise parameters
  spread_noise: 0.25
  risk_noise: 0.15
  
  # Trade execution parameters
  slippage_points: [0, 2]
  execution_delay_seconds: [0, 3]
  
  # Shuffling options
  shuffle_trades: true
  resample_returns: true

# ============================================================
# OPTIMIZATION ZONES
# ============================================================

zones:

  # ----------------------------------------------------------
  # SAFE ZONE (Conservative, industry-style ranges)
  # ----------------------------------------------------------

  safe:
    description: "Conservative, industry-standard parameter ranges"
    enabled: true

    optimization:
      rsi:
        overbought: [65, 75]
        oversold: [25, 35]
        step: 1

      htf:
        # timeframe: ["15min", "30min", "1h"]
        timeframe: ["1H"]
      atr:
        length: [10, 14]
        multiplier: [1.5, 2.0]

      risk:
        max_risk_percentile: [0.08, 0.12]   # 0.08% – 0.12%

      rr_target: [3.0, 4.0]

      session:
        windows:
          - ["08:00", "11:00"]
          - ["14:00", "17:00"]

  # ----------------------------------------------------------
  # EXPLORATION ZONE (Broader discovery)
  # ----------------------------------------------------------

  exploration:
    description: "Expanded parameter discovery zone"
    enabled: true

    optimization:
      rsi:
        overbought: [60, 85]
        oversold: [15, 40]
        step: 1

      htf:
        # timeframe: ["5min", "15min", "30min", "45min", "1h"]
        timeframe: ["1H"]

      atr:
        length: [7, 21]
        multiplier: [1.2, 2.5]

      risk:
        max_risk_percentile: [0.05, 0.15]

      rr_target: [2.5, 5.0]

      session:
        windows:
          - ["07:00", "11:30"]
          - ["13:00", "18:00"]

  # ----------------------------------------------------------
  # DISCOVERY ZONE (Unusual / extreme exploration)
  # ----------------------------------------------------------

  discovery:
    description: "Unusual / extreme parameter exploration"
    enabled: false   # Disabled by default due to extreme ranges

    optimization:
      rsi:
        overbought: [50, 90]
        oversold: [10, 50]
        step: 1

      htf:
        # timeframe: ["1min", "3min", "5min", "15min", "30min", "45min", "1h"]
        timeframe: ["1H"]
      
      atr:
        length: [5, 30]
        multiplier: [0.8, 3.0]

      risk:
        max_risk_percentile: [0.03, 0.20]

      rr_target: [2.0, 6.0]

      session:
        windows:
          - ["06:00", "19:00"]

# ============================================================
# OUTPUT SETTINGS
# ============================================================

output:
  base_dir: "outputs/backtests"
  save_equity_curves: true
  save_trade_logs: true
  save_yaml_used: true
  save_candidate_configs: true
  
  # Report generation
  generate_summary_report: true
  generate_comparison_report: true
  
  # Verbosity control
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR