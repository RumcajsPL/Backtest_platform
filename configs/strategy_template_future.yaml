# configs/strategy_template.yaml
# Generic strategy template for the new architecture
# Living document - Version 1.0 (Session 19)
# Works with real data paths from legacy structure

strategy:
  name: "WBWS Strategy"
  version: "2.0.0"
  description: "We Buy/We Sell Trigger with filter pipeline"

asset:
  symbol: "DEUIDXEUR"
  exchange: "EUREX"
  currency: "EUR"

data:
  paths:
    # Core OHLCV data
    strategy_ohlcv: "data/processed/ohlcv/DEUIDXEUR_1min_20240101_20260207.parquet"
    
    # Higher Timeframe (required for WBWSTrigger)
    htf_ohlcv: "data/processed/ohlcv/DEUIDXEUR_1H_20240101_20260207.parquet"
    
    # Lower Timeframe (optional, for realistic execution)
    ltf_ohlcv: "data/processed/ohlcv/DEUIDXEUR_1s_20240101_20260207.parquet"
    
    # Annual Range Timeframe (optional, for risk management)
    artf_ohlcv: "data/processed/ohlcv/DEUIDXEUR_1ME_20210101_20260207.parquet"
  
  date_range:
    # Full Q4 2025 test period
    start: "2025-09-14 08:00:00"
    end: "2025-12-17 21:00:00"
  
  # Timezone is informational only - data is already in CET (UTC+1)
  timezone: "Europe/Berlin"
  format: "parquet" 

execution:
  mode: "core"  # | analytics Will be overridden by test script for analytics mode

signal:
  trigger: "WBWSTrigger"
  # HTF period must match the htf_ohlcv file resolution
  htf_period: "1H"  # Must align with htf_ohlcv file
  parameters: {}  # WBWSTrigger has no additional parameters

filters:
  # Time filter (special - always runs first)
  time_filter:
    enabled: true
    session_start: "08:30"
    session_end: "20:30"
  
  # Technical filters - matching legacy config
  technical_filters:
    rsi_filter:
      enabled: true
      length: 14
      overbought: 70
      oversold: 30
    
    dpo_filter:
      enabled: false
      length: 20
      smooth: 3
      threshold: 0.2
    
    bollinger_filter:
      enabled: false
      length: 14
      width_ma_length: 30
      filter_multiplier: 0.5
      std_dev: 2.0
    
    choppiness_filter:
      enabled: false
      length: 14
      threshold: 61.8
    
    supertrend_filter:
      enabled: false
      atr_length: 10
      factor: 3.0
    
    cci_filter:
      enabled: false
      length: 20
      overbought: 100
      oversold: -100
    
    adx_filter:
      enabled: false
      adx_length: 14
      threshold: 18.0
    
    macd_filter:
      enabled: false
      fast_length: 12
      slow_length: 26
      signal_length: 9
    
    ma_filter:
      enabled: false
      ma_type: "TEMA"
      length: 25
      slope_length: 10
    
    pivot_filter:
      enabled: false
      reversal_percent: 0.2
      order: 5
  
  # Filter execution order (time_filter always first, not listed here)
  filter_sequence:
    - rsi_filter
    - choppiness_filter
    - bollinger_filter
    - adx_filter
    - supertrend_filter
    - ma_filter
    - pivot_filter
    - cci_filter
    - macd_filter
    - dpo_filter

trade_management:
  spread:
    enabled: true
    type: "points"  # "percentage", "points", or "pips"
    value: 1.0  # 1 point spread for DEUIDXEUR
    apply_to_long: true
    apply_to_short: true
  
  risk:
    enabled: true  # Add this line - was missing!
    atr_length: 14
    sl_multiplier: 1.4  # ATR multiplier for stop loss
    tp_multiplier: 7.98  # Derived from risk_to_reward_ratio=5.7 (1.4 * 5.7)
    max_risk_percentile: 0.1  # 0.1% of annual range (0.0-5.0 range)
    allow_exceed_limit: false
  
  position_control:
    pyramiding_enabled: false
    max_positions: 1
    close_on_opposite: false

output:
  reports_dir: "outputs/strategies/reports"
  signals_dir: "outputs/strategies/signals"
  save_raw_data: false  # Layer 3 in HTML report
  verbose: false  # Legacy - will be removed