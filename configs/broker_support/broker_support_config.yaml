# broker_support_config.yaml
# Live paper trading configuration for broker_support Phase 2.
# This file is the single source of truth for all live-execution overrides.
# Strategy signal logic lives in the strategy YAML — this file only governs
# what is specific to live execution: data fetching, trading window, order sizing.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Strategy candidate to run
# ---------------------------------------------------------------------------
strategy:
  yaml_path: outputs/backtesting/trading_yamls/b651ec5c_c424a0e04327_strategy.yaml

# ---------------------------------------------------------------------------
# Live data fetching
# Overrides strategy YAML data.paths (parquet files not used in live context).
# artf_ohlcv_path is injected explicitly — keeps live config self-contained.
# ---------------------------------------------------------------------------
live_data:
  artf_ohlcv_path: data/processed/ohlcv/DEUIDXEUR_1ME_20210101_20260301.parquet
  strategy_bars_to_fetch: 500    # 1-min bars (~8h 20min, enough for ATR(11) + all filters)
  htf_bars_to_fetch: 120         # 1H bars (~5 days, enough for HTF signal context)
  strategy_interval: OneMinute   # eToro candles interval — must match strategy TF
  htf_interval: OneHour          # eToro candles interval — must match htf_period in YAML
  candle_direction: desc         # desc = newest first, reversed to asc before pipeline

# ---------------------------------------------------------------------------
# WBWS+ trading window filter
# Applied as a second gate AFTER the strategy time_filter (08:30–20:30 CET).
# Controls execution quality — not signal validity.
# allowed_hours_utc: hours during which order placement is permitted.
# skip_hours_utc: explicit block list (belt-and-suspenders, subset of above).
# NOTE: first hour in allowed_hours_utc is also used as the session-resume
#       time after a pause_until_next_day consecutive-loss action.
# ---------------------------------------------------------------------------
trading_window:
  enabled: true
  allowed_hours_utc: [9, 10, 11, 12, 13, 14, 15, 16]  # London core + early NY overlap
  skip_hours_utc: [17, 18]                              # Consistently negative both periods
  monday_size_factor: 1.0   # 1.0 = full size; 0.5 = half size on Monday

# ---------------------------------------------------------------------------
# Order execution parameters
# No equivalent in strategy YAML — broker_support owns these entirely.
# ---------------------------------------------------------------------------
execution:
  instrument_map_path: configs/broker_support/instrument_map.yaml
  symbol: GER40
  amount_usd: 60.0
  leverage: 20

# ---------------------------------------------------------------------------
# Safety / circuit-breaker configuration
# Enforced by PaperTradingGuard in the automated loop.
# run_signal.py (supervised single trade) ignores these entirely.
# ---------------------------------------------------------------------------
safety:
  # Hard cap on simultaneous open positions (belt-and-suspenders).
  # Strategy YAML max_positions=1 is the authoritative pyramiding limit.
  max_open_positions: 5

  # Loop halts if portfolio credit drops below this value (USD).
  min_available_cash_usd: 200.0

  # Consecutive losing trades before the circuit breaker fires.
  # A winning trade resets the counter to zero.
  max_consecutive_losses: 3

  # Action when max_consecutive_losses is reached:
  #   hard_stop          — loop exits permanently (use this for first live week)
  #   pause_until_next_day — loop sleeps until first allowed_hours_utc hour
  #                          on the next calendar day (UTC), then resumes
  consecutive_loss_action: hard_stop

  # Daily drawdown hard stop: halt if loss today >= X% of session-open credit.
  # Example: 5.0 means a 5% drop from today's opening credit triggers halt.
  max_daily_drawdown_pct: 5.0

  # Consecutive SignalBridge / pipeline failures before hard stop.
  # Protects against silent infrastructure issues (API down, data feed broken).
  max_pipeline_errors: 5

  # Create a file with this name in the project root to halt the loop
  # immediately at the next poll cycle (no trade will be placed).
  # Delete the file before restarting.
  kill_switch_file: STOP