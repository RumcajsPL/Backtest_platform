# Global settings
settings:
  # When true, applies spread to LONG positions (entry price increases)
  # When true, applies spread to SHORT positions (entry price decreases)
  apply_to_long: true
  apply_to_short: true
  
  # Spread application method:
  # "entry_only" = Apply spread only to entry price (RECOMMENDED - matches broker reality)
  # "entry_and_exit" = Apply spread to both entry and exit (conservative, double-counts)
  application_method: "entry_only"
  
  # Validation
  require_spread_for_all_assets: true
  warn_on_missing_spread: true