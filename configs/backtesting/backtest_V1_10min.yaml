# =============================================================================
# backtest_V1_10min.yaml – Calibration E
# Version: 3.1.0
# Date: 2026-03-20
#
# CONFIGURATION: STF=10min / HTF=4H
# PURPOSE: Narrowed parameter ranges to ensure ensure cover of the productive region observed in top candidates while cutting off dead space
#          (only safe zone: DPO+MA) to guide final calibration (if still required).
# Recommended _SIGMOID_SCALE = stdev × 0.5 = 242.1
# SERIES:     10min A → B → C -> D -> E
# =============================================================================
# Previous run - backtest_V1_10min_D_datacollect.yaml – Data Collection Run
# Version: 3.1.0
# Date: 2026-03-20
#
# CONFIGURATION: STF=10min / HTF=4H
# PURPOSE: Collect trade frequency and performance data for two filter sets
#          (DPO+MACD and DPO+MA+Bollinger) to guide final calibration.
#
# SERIES:     10min A → B → C -> D
# =============================================================================
# Previous run - backtest_V1_10min.yaml – Calibration C
# Version: 3.0.0
# Date: 2026-03-20
#
# CONFIGURATION: STF=10min / HTF=4H
# BASE FILTERS:  DPO + MA + Bollinger Bands (exploration zone only)
#
# PARENT RUN: 7ce7beb1-5940-443d-aef2-dd351b5fee2a (calibration B)
# SERIES:     10min A → B → C ->
#
# =============================================================================
# WHAT RUN B PROVED
# =============================================================================
#
# run_id 7ce7beb1-5940-443d-aef2-dd351b5fee2a (calibration B)
#
# Stage 1 pass rate: 17% (69/400) – improved from 8% but still below 30–60%.
# Main rejections: INSUFFICIENT_TRADES (188), trades_per_week (80), win_rate (40).
# Average trades/week = 0.68; top candidates achieve 1–2 trades/week.
#
# Stage 4 WFO: 30 candidates scored, 25 collapsed (per-window drawdown >400 pts).
# Five non‑collapsed candidates emerged, with 1–7 windows evaluated:
#   - d10d50790f5d: 5 windows, WFO=0.8453, spike in atr_mult/boll_mult/dpo_len
#   - a055096e13c0: 7 windows, WFO=0.7758, spike in atr_mult
#   - 7012af148a04: 1 window,  WFO=0.9083, spike in atr_mult/dpo_len/ma_slope
#   - 6b986ffca372: 1 window,  WFO=0.8980, spike in atr_mult
#   - f50625b58d10: 1 window,  WFO=0.6277, spike in ma_slope/rr_target
#
# Three candidates with ≥4 windows and no spike (81b6, e516, 8e22) all collapsed.
# No auto_go candidates – all 10 final verdicts are borderline.
#
# Sigmoid scale from run B: stdev(net_pnl) = 362.21 → recommended scale = 181.1.
# Run B used 163.0 (slightly under‑scaled).
#
# KEY FINDINGS:
#   1. Trade starvation persists with 3‑month windows (many windows have <20 trades).
#      Longer windows are needed to increase evaluable windows per candidate.
#   2. The productive parameter region remains wide – no clear clustering yet.
#   3. Collapse rate is high, but non‑collapsed candidates exist with multiple windows.
#   4. Sensitivity spikes are common, especially in atr_multiplier.
#
# =============================================================================
# CHANGES FOR CALIBRATION C
# =============================================================================
#
#  1. SWITCH TO 4×9‑MONTH WINDOWS (instead of 13×3‑month) to increase trade
#     counts per window. This matches the successful 15‑minute series structure.
#     Windows cover the full 38‑month period with ~9‑month slices.
#
#  2. UPDATE _SIGMOID_SCALE to 181.0 in consistency_scorer.py (from 163.0).
#
#  3. LOWER min_trades_per_week to 0.3 (from 0.5) to increase Stage 1 pass rate.
#     This allows more candidates into GA, relying on WFO to filter low‑trade ones.
#
#  4. All other constraints unchanged (min_win_rate=0.11, max_losing_streak=30).
#
#  5. Parameter ranges remain identical to run B – no narrowing yet, as top
#     candidates show wide diversity. Further narrowing will be considered after C.
#
#  6. Keep exploration zone only; safe zone remains disabled.
#
# =============================================================================
# KEY QUESTIONS FOR CALIBRATION C
# =============================================================================
#
#  1. Do 9‑month windows increase the number of evaluated windows per candidate?
#     Target: top candidates achieve ≥6 windows out of 4 (i.e., all windows).
#
#  2. With higher trade counts, does the collapse rate decrease?
#
#  3. Does the new sigmoid scale improve fitness differentiation?
#
#  4. Can we obtain an auto_go candidate (no spike, no collapse, WFO ≥0.40,
#     windows_evaluated ≥3)?
#
# RUNTIME ESTIMATE: 6–9 hours at max_workers=4 (fewer windows, but longer each)
#   Stage 1:  ~60–80 min  (400 candidates)
#   Stage 3:  ~4–6 hrs    (GA 40gen × 70pop)
#   Stage 4:  ~2–3 hrs    (4 windows × 30 candidates)
#   Stage 5:  ~20–30 min
#   Stage 6:  ~20–30 min
#   Stage 7:  ~5 min
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"        

strategy:
  base_yaml_path: "configs/strategies/strategy_template10min.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 4
  log_level: "INFO"

stages:
  random_search:     true
  mc_prefilter:      false
  genetic_algorithm: true          
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true            

random_search:
  method: "lhs"
  samples_per_zone: 500              
  min_significant_trades: 20         
  seed: 42

genetic:                            
  population_size: 70
  generations: 40
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 12
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44

walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50
  windows:
    - {id: "W01", start: "2023-01-02", end: "2023-09-29"}
    - {id: "W02", start: "2023-10-02", end: "2024-06-28"}
    - {id: "W03", start: "2024-07-01", end: "2025-03-31"}
    - {id: "W04", start: "2025-04-01", end: "2026-02-28"}

monte_carlo:
  deep:                              # not used
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45

sensitivity:                         # not used
  input_count: 10
  max_steps: 1
  spike_threshold: 0.15
  seed: 46

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.11
      max_losing_streak: 30
      min_trades_per_week: 0.3
      min_expectancy: -2.0
      min_profit_factor: 0.75
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 400.0
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.40
      borderline_wfo_floor: 0.25
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  e2e_test:
    description: "Pipeline validation only — NOT FOR TRADING USE"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.20
      max_drawdown: 0.20
      win_rate: 0.20
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.05
      max_drawdown: 0.99
      max_losing_streak: 9999
      min_trades_per_week: 0.05
      min_expectancy: -10.0
      min_profit_factor: 0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.25
      variance: 0.25
      worst_drawdown: 0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor: 0.01
      borderline_wfo_floor: 0.005
      go_mc_ruin_ceiling: 0.99
      borderline_mc_ruin_ceiling: 0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  safe:
    enabled: true
    parameters:
      # ATR / risk
      atr_length:           {type: int,   min: 10,    max: 24,   step: 1}
      atr_multiplier:       {type: float, min: 1.0,  max: 2.5,  step: 0.1}
      rr_target:            {type: float, min: 5.0,  max: 12.0, step: 0.5}
      risk_percentile:      {type: float, min: 0.7,  max: 1.2,  step: 0.05}
      # DPO
      dpo_length:           {type: int,   min: 12,   max: 30,   step: 2}
      dpo_smooth:           {type: int,   min: 1,    max: 20,   step: 1}
      dpo_threshold:        {type: float, min: 0.05, max: 0.45, step: 0.05}
      # MA slope (trend context)
      ma_length:            {type: int,   min: 15,  max: 60,  step: 5}
      ma_slope_length:      {type: int,   min: 5,   max: 20,  step: 5}
  exploration:
    enabled: false
    parameters:
      # Original wide ranges for DPO+MA+Bollinger
      atr_length:           {type: int,   min: 5,   max: 35,  step: 2}
      atr_multiplier:       {type: float, min: 0.5, max: 3.5, step: 0.25}
      rr_target:            {type: float, min: 3.0, max: 12.0, step: 1.0}
      risk_percentile:      {type: float, min: 0.30, max: 1.1, step: 0.05}
      dpo_length:           {type: int,   min: 10,  max: 35,  step: 2}
      dpo_smooth:           {type: int,   min: 1,   max: 25,  step: 1}
      dpo_threshold:        {type: float, min: 0.05, max: 0.50, step: 0.05}
      ma_length:            {type: int,   min: 15,  max: 60,  step: 5}
      ma_slope_length:      {type: int,   min: 5,   max: 20,  step: 5}
      bollinger_length:     {type: int,   min: 5,   max: 40,  step: 2}
      bollinger_multiplier: {type: float, min: 0.1, max: 1.5, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 15,  max: 60,  step: 5}
  discovery:
    enabled: false