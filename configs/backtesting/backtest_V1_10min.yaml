# =============================================================================
# backtest_V1_10min.yaml – Calibration B
# Version: 2.0.0
# Date: 2026-03-19
#
# CONFIGURATION: STF=10min / HTF=4H
# BASE FILTERS:  DPO + MA + Bollinger Bands (exploration zone only)
#
# PARENT RUN: bc633082-9fcd-4030-acc1-7b975398d0f8 (calibration A)
# SERIES:     10min A → B
#
# =============================================================================
# WHAT RUN A PROVED
# =============================================================================
#
# run_id bc633082-9fcd-4030-acc1-7b975398d0f8 (calibration A)
#
# Stage 1 pass rate: 8% (33/400). Primary rejections:
#   - INSUFFICIENT_TRADES (210) – min_significant_trades=30 too high for 10min.
#   - win_rate (107) – min_win_rate 0.18 cuts just above average (0.177).
#   - trades_per_week (38) – average trades/week = 0.66.
#
# Stage 4 WFO: 30 candidates scored, 28 collapsed (per-window drawdown >400 pts).
# Only three candidates had >2 windows evaluated:
#   - fd88bf5233b9 (exploration): 2 windows, WFO=0.8751 → borderline (spike in atr_multiplier)
#   - 8bbed2b1eaa6 (exploration): 5 windows, WFO=0.7742 → auto_go (no spike, no collapse)
#   - 7cc3b747f017 (safe): 3 windows, WFO=0.5641 → borderline (spike in ma_length, collapsed)
#
# Key findings:
#   1. Safe zone produced only one candidate with any windows evaluated, and it collapsed.
#      Safe zone appears unproductive at 10min given current trade frequency.
#   2. Exploration zone auto_go candidate 8bbed2b1eaa6 hit several range boundaries:
#      - ma_length = 50 (max)
#      - dpo_length = 14 (min)
#      - dpo_smooth = 2 (min)
#      - dpo_threshold = 0.1 (min)
#      This suggests the optimal region may extend beyond current ranges.
#   3. The hardcoded sigmoid scale 310.0 is too high for 10min P&L distribution.
#      Computed from run: stdev(net_pnl) = 326.48 → recommended scale = 163.2.
#   4. min_significant_trades = 30 starves many windows; lowering to 20 will
#      increase evaluable windows (e.g., 8bbed2b would gain W01, W09, W10, W12, W13 → 10 windows).
#
# =============================================================================
# CHANGES FOR CALIBRATION B
# =============================================================================
#
#  1. DISABLE SAFE ZONE – set `enabled: false`. All search effort concentrated
#     in exploration zone (DPO+MA+BB).
#
#  2. INCREASE samples_per_zone to 400 (exploration only) – improves coverage
#     of the parameter space.
#
#  3. LOWER min_significant_trades to 20 – increases window evaluability.
#
#  4. ADJUST CONSTRAINTS based on Stage 1 distributions:
#       min_win_rate: 0.18 → 0.11   (average win_rate 0.177)
#       max_losing_streak: 20 → 30  (average 17.2, max 57)
#     Others (min_trades_per_week, min_expectancy, min_profit_factor) unchanged.
#
#  5. UPDATE _SIGMOID_SCALE to 163.0 in consistency_scorer.py (from 310.0).
#
#  6. EXPAND PARAMETER RANGES where top candidate hit boundaries (exploration zone):
#       ma_length: max 50 → 60 (step 5)
#       dpo_length: min 14 → 10 (step 2)
#       dpo_smooth: min 2 → 1 (step 1) – allow exploring minimal smoothing
#       dpo_threshold: min 0.10 → 0.05 (step 0.05) – allow lower threshold
#     Other ranges unchanged.
#
#  7. INCREASE GA BUDGET to better search the now-larger parameter space:
#       population_size: 60 → 70
#       generations: 30 → 40
#       stagnation_generations: 10 → 12 (to match longer evolution)
#
#  8. INCREASE max_workers to 4 (from 2) – runtime estimate still comfortable
#     with 8GB RAM because only one zone active and per-candidate evaluation
#     is lighter than 1min runs.
#
# =============================================================================
# KEY QUESTIONS FOR CALIBRATION B
# =============================================================================
#
#  1. With 400 samples in exploration zone and relaxed constraints, does
#     Stage 1 pass rate rise to 30–60%?
#
#  2. After lowering min_significant_trades to 20, do top candidates achieve
#     windows_evaluated >= 8 (i.e., >60% of the 13 windows)?
#
#  3. Does expanding ma_length to 60 and dpo_length to 10 produce candidates
#     with WFO > 0.80 and no collapse?
#
#  4. Can we identify more than one auto_go candidate with windows_evaluated >= 5?
#
#  5. Does the new sigmoid scale (163) improve fitness differentiation?
#
# RUNTIME ESTIMATE: 10–14 hours at max_workers=4
#   Stage 1:  ~60–80 min  (400 candidates, 4 workers)
#   Stage 3:  ~4–6 hrs    (GA 40gen × 70pop)
#   Stage 4:  ~5–7 hrs    (13 windows × 30 candidates)
#   Stage 5:  ~20–30 min
#   Stage 6:  ~20–30 min
#   Stage 7:  ~5 min
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"

strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 4                     # increased from 2
  log_level: "INFO"

stages:
  random_search:     true
  mc_prefilter:      false            # full-history run – keep disabled
  genetic_algorithm: true
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true

random_search:
  method: "lhs"
  samples_per_zone: 400                # only one zone active
  min_significant_trades: 20            # lowered from 30
  seed: 42

genetic:
  population_size: 70                   # increased from 60
  generations: 40                        # increased from 30
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 12             # increased from 10
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44

walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50
  windows:
    - {id: "W01", start: "2023-01-02", end: "2023-03-31"}
    - {id: "W02", start: "2023-04-03", end: "2023-06-30"}
    - {id: "W03", start: "2023-07-03", end: "2023-09-29"}
    - {id: "W04", start: "2023-10-02", end: "2023-12-29"}
    - {id: "W05", start: "2024-01-02", end: "2024-03-28"}
    - {id: "W06", start: "2024-04-01", end: "2024-06-28"}
    - {id: "W07", start: "2024-07-01", end: "2024-09-30"}
    - {id: "W08", start: "2024-10-01", end: "2024-12-31"}
    - {id: "W09", start: "2025-01-02", end: "2025-03-31"}
    - {id: "W10", start: "2025-04-01", end: "2025-06-30"}
    - {id: "W11", start: "2025-07-01", end: "2025-09-30"}
    - {id: "W12", start: "2025-10-01", end: "2025-12-31"}
    - {id: "W13", start: "2026-01-02", end: "2026-02-28"}

monte_carlo:
  deep:
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45

sensitivity:
  input_count: 10
  max_steps: 1
  spike_threshold: 0.15
  seed: 46

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.11               # lowered from 0.18
      max_losing_streak: 30             # increased from 20
      min_trades_per_week: 0.5
      min_expectancy: -2.0
      min_profit_factor: 0.75
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 400.0
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.40
      borderline_wfo_floor: 0.25
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  e2e_test:
    description: "Pipeline validation only — NOT FOR TRADING USE"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.20
      max_drawdown: 0.20
      win_rate: 0.20
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.05
      max_drawdown: 0.99
      max_losing_streak: 9999
      min_trades_per_week: 0.05
      min_expectancy: -10.0
      min_profit_factor: 0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.25
      variance: 0.25
      worst_drawdown: 0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor: 0.01
      borderline_wfo_floor: 0.005
      go_mc_ruin_ceiling: 0.99
      borderline_mc_ruin_ceiling: 0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  safe:
    enabled: false                      # safe zone inactive after run A
  exploration:
    # Filters active: DPO + MA + Bollinger Bands (all always on)
    enabled: true
    parameters:
      atr_length:           {type: int,   min: 5,   max: 35,  step: 2}
      atr_multiplier:       {type: float, min: 0.5, max: 3.5, step: 0.25}
      rr_target:            {type: float, min: 3.0, max: 12.0, step: 1.0}
      risk_percentile:      {type: float, min: 0.30, max: 1.1, step: 0.05}
      dpo_length:           {type: int,   min: 10,  max: 35,  step: 2}    # min lowered from 14
      dpo_smooth:           {type: int,   min: 1,   max: 25,  step: 1}    # min lowered from 2
      dpo_threshold:        {type: float, min: 0.05, max: 0.50, step: 0.05} # min lowered from 0.10
      ma_length:            {type: int,   min: 15,  max: 60,  step: 5}    # max increased from 50
      ma_slope_length:      {type: int,   min: 5,   max: 20,  step: 5}
      bollinger_length:     {type: int,   min: 5,   max: 40,  step: 2}
      bollinger_multiplier: {type: float, min: 0.1, max: 1.5, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 15,  max: 60,  step: 5}
  discovery:
    enabled: false