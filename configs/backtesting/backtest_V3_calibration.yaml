# =============================================================================
# backtest_V3_calibration_fullpipeline.yaml
# Version: 5.0.0
# Date: 2026-03-10  (Block 9O — Step 2 calibration)
#
# PURPOSE:
#   Full pipeline calibration run (Stages 1–7).
#   Goal: obtain at least 1 candidate with a full verdict (MC Deep + Sensitivity)
#   before updating backtest_V1_01.yaml for overnight production run.
#
# CHANGES FROM v4.0.0 (backtest_V3_calibration.yaml):
#
#   1. All stages enabled (was Stage 1 + Stage 4 only)
#      mc_prefilter:      true   — cheap ruin screen before GA
#      genetic_algorithm: true   — WFO-aware search for better candidates
#      monte_carlo_deep:  true   — full MC evidence for survivors
#      sensitivity:       true   — parameter stability check
#
#   2. samples_per_zone: 30 → 20
#      40 total candidates (20 safe + 20 exploration). Expected ~22 Stage 1
#      passers based on run 519f84e2 distributions (55% pass rate).
#      Sufficient for MC/Sensitivity coverage. Saves ~30% Stage 1 runtime.
#
#   3. seed: 42 → 99
#      Fresh candidate set — avoids re-evaluating identical LHS samples
#      from calibration runs 2912e028 / 519f84e2.
#
#   4. walk_forward.input_count: 60 → 40
#      Matches reduced sample count. Accepts all Stage 1 passers.
#
#   5. verdict_thresholds.go_wfo_floor: 0.65 → 0.40
#      RATIONALE: structural W02/W05/W06 window failures suppress all WFO
#      scores below 0.65 regardless of candidate quality (confirmed across
#      2 calibration runs — best score observed = 0.8334 on 3/7 windows only,
#      next best = 0.6987 on 5/7 windows). 0.65 floor produces zero verdicts.
#      0.40 = former borderline_wfo_floor — admits candidates with 4+/7 good
#      windows and positive median return. borderline_wfo_floor lowered to 0.25
#      to maintain separation.
#
# EXPECTED RUNTIME: ~3–5 hours
#   Stage 1:  ~8–10 min   (40 candidates, max_workers=2)
#   Stage 2:  ~15–20 min  (MC pre-filter, ~22 passers)
#   Stage 3:  ~30–45 min  (GA, 3 generations × 2 windows)
#   Stage 4:  ~90–120 min (Full WFO, ~30 candidates × 7 windows)
#   Stage 5:  ~20–30 min  (MC Deep, top survivors)
#   Stage 6:  ~10–15 min  (Sensitivity)
#   Stage 7:  ~1 min      (Report)
#
# CALIBRATION STATE AT TIME OF THIS RUN:
#   _SIGMOID_SCALE          = 310.0   (confirmed N=231, stdev=620.09, runs 2912e028+519f84e2)
#   _MAX_EXPECTED_DRAWDOWN  = 2_500.0 (full-history track)
#   max_workers             = 2       (mandatory — OOM at 6 on cold cache, 8GB RAM)
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"

strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 2       # MANDATORY — full-history: 2 × ~900MB cold-cache peak = ~1.8GB.
                       # Do NOT raise until shared-memory architecture implemented (B9O-009).
  log_level: "INFO"

# Full pipeline — all stages enabled
stages:
  random_search:     true
  mc_prefilter:      true
  genetic_algorithm: true
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true

random_search:
  method: "lhs"
  samples_per_zone: 20     # 20 × 2 zones = 40 total. Expected ~22 passers (55% rate confirmed).
  min_significant_trades: 30
  seed: 99                 # Fresh seed — different from calibration runs (seed=42)

walk_forward:
  input_count: 40          # Accepts all Stage 1 passers (40 total candidates)
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50

  # 7 rolling 3-month windows — same as calibration runs for consistency
  # W02/W05/W06 are structurally weak (regime) — confirmed across 2 runs.
  # WFO score floor lowered to 0.40 to admit candidates despite structural failures.
  windows:
    - id: "W01"
      start: "2023-01-02"
      end:   "2023-03-31"
    - id: "W02"
      start: "2023-04-03"
      end:   "2023-06-30"
    - id: "W03"
      start: "2023-07-03"
      end:   "2023-09-29"
    - id: "W04"
      start: "2023-10-02"
      end:   "2023-12-29"
    - id: "W05"
      start: "2024-01-02"
      end:   "2024-03-28"
    - id: "W06"
      start: "2024-04-01"
      end:   "2024-06-28"
    - id: "W07"
      start: "2024-07-01"
      end:   "2024-09-30"

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.11         # Confirmed correct — avg=0.1486, removes bottom ~5% only
      max_losing_streak: 200     # Confirmed correct — 38-month max observed=91
      min_trades_per_week: 3.0   # Confirmed correct — 1 failure observed across all runs
      min_expectancy: -2.0       # Confirmed correct — avg=-1.69, targets top ~60-65%
      min_profit_factor: 0.75    # Confirmed correct — no failures at this threshold
      # max_drawdown: REMOVED — accumulates over 38 months. Stage 4 WFO gates per-window.
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 400.0
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.40         # Lowered from 0.65 — structural W02/W05/W06 failures
                                 # suppress all scores. Best observed = 0.8334 (3 windows only),
                                 # best reliable (5/7 windows) = 0.6987. 0.65 = zero verdicts.
                                 # 0.40 admits candidates with positive median return + 4+/7 windows.
      borderline_wfo_floor: 0.25 # Lowered from 0.40 to maintain separation from go_wfo_floor
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  safe:
    enabled: true
    parameters:
      rsi_period:           {type: int,   min: 8,  max: 20, step: 1}
      rsi_overbought:       {type: int,   min: 51, max: 80, step: 1}
      rsi_oversold:         {type: int,   min: 20, max: 49, step: 1}
      atr_length:           {type: int,   min: 6,  max: 20, step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 2.5, step: 0.1}
      rr_target:            {type: float, min: 3.0, max: 8.5, step: 0.1}
      risk_percentile:      {type: float, min: 0.2, max: 0.65, step: 0.01}
      bollinger_length:     {type: int,   min: 8,  max: 20, step: 1}
      bollinger_multiplier: {type: float, min: 0.3, max: 1.1, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 10, max: 50, step: 1}

  exploration:
    enabled: true
    parameters:
      rsi_period:           {type: int,   min: 8,  max: 24, step: 1}
      rsi_overbought:       {type: int,   min: 52, max: 82, step: 1}
      rsi_oversold:         {type: int,   min: 18, max: 48, step: 1}
      atr_length:           {type: int,   min: 7,  max: 24, step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 3.0, step: 0.1}
      rr_target:            {type: float, min: 3.0, max: 10.0, step: 0.1}
      risk_percentile:      {type: float, min: 0.15, max: 0.70, step: 0.01}
      bollinger_length:     {type: int,   min: 8,  max: 22, step: 1}
      bollinger_multiplier: {type: float, min: 0.3, max: 1.5, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 15, max: 55, step: 1}
      choppiness_length:    {type: int,   min: 12, max: 22, step: 1}
      choppiness_threshold: {type: float, min: 55.0, max: 65.0, step: 0.5}
      dpo_length:           {type: int,   min: 15, max: 25, step: 1}
      dpo_smooth:           {type: int,   min: 8,  max: 18, step: 1}
      dpo_threshold:        {type: float, min: 0.15, max: 0.40, step: 0.05}

  discovery:
    enabled: false