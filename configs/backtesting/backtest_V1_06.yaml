# =============================================================================
# backtest_V1_06.yaml
# Version: 3.0.0
# Date: 2026-03-15
#
# CONFIGURATION: STF=15min / HTF=1D
# BASE FILTERS:  DPO + MACD (safe zone)
# EXPLORATION:   DPO + MACD + CCI (exploration zone)
#
# PARENT RUN: 2d50b27e  (backtest_V1_06 v2.0)
# GRANDPARENT: 6b137540  (backtest_V1_06 v1.3)
#
# =============================================================================
# DIAGNOSIS ACROSS TWO RUNS (6b137540 + 2d50b27e)
# =============================================================================
#
# PERSISTING STRUCTURAL PROBLEM: 1-window phantom auto_go verdicts.
#
#   Despite go_wfo_floor raised to 0.55 in v2.0, two candidates still received
#   auto_go on 1 window: 0d921ad4b8a9 (WFO=0.9507) and 7616d2607625 (WFO=0.9391).
#   The WFO scorer assigns near-perfect scores to 1-window candidates because
#   variance=0 and frac_pos=1.0 are trivially true for a single data point.
#   go_wfo_floor does not prevent this — the fix must be upstream.
#
#   V2 action required: minimum windows_evaluated gate in the verdict engine.
#   If windows_evaluated < 3, verdict = INSUFFICIENT_COVERAGE regardless of score.
#   For now: raise go_wfo_floor to 0.65 — forces 2-3 real windows to be needed
#   even for phantom scores to clear the bar. Not a proper fix, but reduces
#   the false positive rate until V2.
#
# WINDOWS W03 AND W05 — STRUCTURAL, NOT FIXABLE BY PARAMETER TUNING:
#
#   W03 (2024 H1, ECB rate cycle): 50 rejections this run. 13–14 trades for
#   most candidates — just below min_significant_trades=15.
#   W05 (2025 H1, range-bound): 162 rejections. Essentially zero candidates
#   generate sufficient trades in this regime.
#
#   This is filter behaviour, not parameter behaviour. DPO+MACD at 15min
#   does not trigger enough in low-volatility / choppy regimes.
#   W03 is recoverable with min_significant_trades=12 (see Change 1).
#   W05 is likely not recoverable within this filter family.
#   Accept W05 as a structural dead window for this strategy family.
#
# STRONGEST SIGNAL FROM THIS RUN — atr_multiplier must come down:
#
#   Sensitivity: every candidate degrades at multiplier +0.1.
#   da44ec91c996: delta +0.072 at multiplier -0.1 — strongest single-parameter
#   signal in either 15min run. Lower multiplier = tighter stop = more trades
#   per window = more windows scoring. This directly addresses starvation.
#   atr_multiplier range 1.7–2.5 across all scored candidates. Upper tail
#   (>2.3) consistently underperforms. Lower tail (1.7–1.9) contains winners.
#   Action: reduce max from 3.0/2.5 → 2.2/2.3 (exploration/safe).
#
# rr_target — confirmed high across two runs:
#
#   Top-5 this run: 8.3, 8.0, 9.3, 6.0, 7.4. Bottom-5: 7.2, 5.0, 5.1, 5.5, 6.5.
#   Range floor can be raised: sub-6.0 consistently bottom half.
#   Previous run top-5: 6.7, 6.8, 4.7, 7.2, 6.4 — 4.7 was an outlier.
#   Action: safe 4.5–9.0 → 6.0–9.5 / exploration 4.0–10.0 → 5.5–10.0
#
# risk_percentile — upper tail confirmed bad:
#
#   Both runs: >1.10 consistently underperforms. Top-5 this run: 0.88–1.10.
#   All-candidate avg=1.016. Bottom-5: 1.17, 1.18.
#   Action: exploration ceiling 1.20 → 1.12 / safe ceiling 1.10 unchanged.
#
# Honest multi-window candidates (windows_evaluated ≥ 3, frac_pos=1.0):
#   fadaf986a898 — 5 windows, WFO=0.747 — most structurally sound candidate
#   a25c382aa687 — 5 windows, WFO=0.573, frac_pos=0.80 — good coverage, 1 bad window
#   These are the benchmark to beat in v3.0.
#
# max_workers=4 confirmed stable at 15min TF. LTF slices smaller than 1min →
# lower memory per worker. Keeping at 4 for this run.
#
# =============================================================================
# CHANGES FROM v2.0
# =============================================================================
#
#   CHANGE 1: min_significant_trades 15 → 12
#     W03 candidates average 13–14 trades — just below the 15 threshold.
#     Dropping to 12 should unlock W03 for a meaningful fraction of candidates,
#     converting the most critical stress window from structural-dead to scored.
#     Risk: 12 trades is thin. Any W03 score at 12 trades should be read with
#     lower confidence than a W02 score at 25 trades.
#     Do NOT go below 12.
#
#   CHANGE 2: atr_multiplier ranges reduced
#     safe:        1.5–2.2 → 1.5–2.0
#     exploration: 1.2–3.0 → 1.2–2.3
#     Evidence: universal degradation at higher multiplier across all 10
#     sensitivity candidates. da44ec91c996 +0.072 at -0.1. Upper tail >2.3
#     never in top-5 across either 15min run.
#     Lower bound unchanged — 1.5/1.2 still potentially productive.
#
#   CHANGE 3: rr_target floor raised
#     safe:        4.5–9.0 → 6.0–9.5
#     exploration: 4.0–10.0 → 5.5–10.0
#     Evidence: sub-6.0 consistently bottom-half across both runs. 4.7 was
#     the single exception (42661df82d3c, previous run) — not reproduced.
#     Upper: slight expansion to 9.5/10.0 — a68c06066c4d at 9.3 was a genuine
#     multi-window candidate (2 windows), suggests upper tail is not dead.
#
#   CHANGE 4: risk_percentile ceiling tightened
#     exploration: 1.20 → 1.12
#     safe: unchanged (0.85–1.10 confirmed correct)
#     Evidence: bottom-5 at 1.17, 1.18 — upper tail confirmed dead across
#     both 15min runs.
#
#   CHANGE 5: go_wfo_floor 0.55 → 0.65 / borderline_wfo_floor 0.35 → 0.45
#     Partial mitigation for phantom 1-window verdicts until V2 gate is built.
#     At 0.65, a 1-window candidate with perfect score (~0.93–0.95) still clears
#     the bar — this does NOT solve the problem but raises it enough that
#     2-window candidates with moderate scores also clear.
#     True fix: minimum windows_evaluated=3 gate in verdict engine (V2).
#
#   CHANGE 6: max_workers 2 → 4
#     Confirmed stable at 15min TF. LTF memory per worker lower than 1min.
#     Runtime reduction: ~30–40% vs max_workers=2.
#     Revert to 2 immediately if any OOM or silent crash observed.
#
# UNCHANGED (deliberate):
#   Sigmoid: 310 hardcoded — stdev=566, recommended=283, inflation ~1.1x. Negligible.
#   6-month WFO windows — confirmed correct for 15min TF.
#   macd_signal min=2 — confirmed fix, do not revert.
#   All constraint thresholds except min_significant_trades.
#   wfo_collapse_drawdown_threshold: 600.0 — correct for 15min observed drawdowns.
#
# RUNTIME ESTIMATE: 6–9 hours at max_workers=4
#   Stage 1:  ~35–50 min  (300 candidates, 4 workers)
#   Stage 2:  DISABLED
#   Stage 3:  ~2–3 hrs    (GA 30gen × 60pop, 4 workers)
#   Stage 4:  ~3–5 hrs    (6 windows × 30 candidates, 4 workers)
#   Stage 5:  ~20–30 min
#   Stage 6:  ~15–20 min
#   Stage 7:  ~5 min
#
# KEY QUESTIONS THIS RUN ANSWERS:
#   1. Does min_significant_trades=12 unlock W03 for meaningful candidates?
#      This is the single most important question — W03 coverage confirms
#      the strategy survives the 2024 H1 choppy regime.
#   2. Does the lower atr_multiplier ceiling concentrate winners in 1.5–2.0?
#   3. Do any candidates score on 4–5 windows with WFO > 0.70?
#      fadaf986a898 (5 windows, WFO=0.747) is the benchmark to beat.
#   4. Does raising go_wfo_floor to 0.65 reduce phantom auto_go promotions
#      or do 1-window candidates still dominate the top spots?
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"

strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 4             # Confirmed stable at 15min TF — revert to 2 if OOM observed
  log_level: "INFO"

stages:
  random_search:     true
  mc_prefilter:      false
  genetic_algorithm: true
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true

random_search:
  method: "lhs"
  samples_per_zone: 150      # 150 × 2 zones = 300 total
  min_significant_trades: 12  # Reduced from 15 — unlock W03 (13–14 trades observed)
                               # Absolute floor — do NOT reduce further
  seed: 42

genetic:
  population_size: 60
  generations: 30
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 8
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44

walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50

  # 6-month windows — confirmed correct for 15min TF.
  # W05 (2025 H1) accepted as structural dead window for DPO+MACD family.
  # W03 (2024 H1) target for recovery via min_significant_trades=12.
  windows:
    - {id: "W01", start: "2023-01-02", end: "2023-06-30"}
    - {id: "W02", start: "2023-07-03", end: "2023-12-29"}
    - {id: "W03", start: "2024-01-02", end: "2024-06-28"}
    - {id: "W04", start: "2024-07-01", end: "2024-12-31"}
    - {id: "W05", start: "2025-01-02", end: "2025-06-30"}
    - {id: "W06", start: "2025-07-01", end: "2026-02-28"}

monte_carlo:
  deep:
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45

sensitivity:
  input_count: 10
  max_steps: 1
  spike_threshold: 0.15
  seed: 46

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl:          0.20
      expectancy:       0.25
      max_drawdown:     0.20
      win_rate:         0.20
      trade_frequency:  0.05
      profit_factor:    0.10
      # SUM = 1.00 ✅
    constraints:
      min_win_rate:        0.18
      max_losing_streak:   25
      min_trades_per_week: 0.1
      min_expectancy:     -1.0
      min_profit_factor:   0.80
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 600.0
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return:    0.30
      variance:         0.30
      worst_drawdown:   0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor:                0.65   # Raised from 0.55 — partial mitigation for
                                           # 1-window phantom verdicts. V2 fix needed:
                                           # windows_evaluated >= 3 gate in verdict engine.
      borderline_wfo_floor:        0.45   # Raised from 0.35 — maintains separation
      go_mc_ruin_ceiling:          0.05
      borderline_mc_ruin_ceiling:  0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  e2e_test:
    description: "Pipeline validation only — NOT FOR TRADING USE"
    fitness_weights:
      net_pnl:          0.20
      expectancy:       0.20
      max_drawdown:     0.20
      win_rate:         0.20
      trade_frequency:  0.10
      profit_factor:    0.10
    constraints:
      min_win_rate:        0.05
      max_drawdown:        0.99
      max_losing_streak:   9999
      min_trades_per_week: 0.01
      min_expectancy:     -10.0
      min_profit_factor:   0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return:    0.25
      variance:         0.25
      worst_drawdown:   0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor:                0.01
      borderline_wfo_floor:        0.005
      go_mc_ruin_ceiling:          0.99
      borderline_mc_ruin_ceiling:  0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  safe:
    # Filters: DPO + MACD
    # atr_multiplier ceiling lowered: 2.2 → 2.0
    # rr_target floor raised: 4.5 → 6.0
    # risk_percentile: unchanged (0.85–1.10 confirmed correct)
    # macd_signal min=2 maintained
    enabled: true
    parameters:
      atr_length:           {type: int,   min: 8,   max: 18,  step: 1}
      atr_multiplier:       {type: float, min: 1.5, max: 2.0, step: 0.1}  # ceiling -0.2
      rr_target:            {type: float, min: 6.0, max: 9.5, step: 0.1}  # floor +1.5
      risk_percentile:      {type: float, min: 0.85, max: 1.10, step: 0.01}
      dpo_length:           {type: int,   min: 14,  max: 30,  step: 1}
      dpo_smooth:           {type: int,   min: 6,   max: 20,  step: 1}
      dpo_threshold:        {type: float, min: 0.10, max: 0.30, step: 0.02}
      macd_fast:            {type: int,   min: 6,   max: 12,  step: 1}
      macd_slow:            {type: int,   min: 14,  max: 30,  step: 1}
      macd_signal:          {type: int,   min: 2,   max: 12,  step: 1}  # min=2 — do not lower

  exploration:
    # Filters: DPO + MACD + CCI
    # atr_multiplier ceiling lowered: 3.0 → 2.3
    # rr_target floor raised: 4.0 → 5.5
    # risk_percentile ceiling: 1.20 → 1.12
    # macd_signal min=2 maintained
    enabled: true
    parameters:
      atr_length:           {type: int,   min: 6,   max: 25,  step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 2.3, step: 0.1}  # ceiling -0.7
      rr_target:            {type: float, min: 5.5, max: 10.0, step: 0.1} # floor +1.5
      risk_percentile:      {type: float, min: 0.80, max: 1.12, step: 0.01} # ceiling -0.08
      dpo_length:           {type: int,   min: 10,  max: 35,  step: 1}
      dpo_smooth:           {type: int,   min: 1,   max: 25,  step: 1}
      dpo_threshold:        {type: float, min: 0.05, max: 0.50, step: 0.05}
      macd_fast:            {type: int,   min: 3,   max: 15,  step: 1}
      macd_slow:            {type: int,   min: 16,  max: 38,  step: 1}
      macd_signal:          {type: int,   min: 2,   max: 16,  step: 1}  # min=2 — do not lower
      cci_length:           {type: int,   min: 10,  max: 30,  step: 1}
      cci_overbought:       {type: int,   min: 51,  max: 120, step: 1}
      cci_oversold:         {type: int,   min: -120, max: -51, step: 1}

  discovery:
    enabled: false