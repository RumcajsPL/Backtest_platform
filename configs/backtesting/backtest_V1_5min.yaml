# =============================================================================
# backtest_V1_5min_B.yaml
# Version: B (focused on safe zone)
# Date: 2026-03-20
#
# CONFIGURATION: STF=5min / HTF=15min
# SAFE ZONE ONLY: DPO + CCI + MACD (exploration zone disabled)
#
# PARENT RUN: (raw A run – ID not logged)
# SERIES:     5min A → B
#
# =============================================================================
# WHAT RUN A PROVED
# =============================================================================
#
# Stage 1 pass rate: 14.8%. Safe zone passed 24% vs exploration 5.6%.
# WFO: 6 auto_go from safe zone, 1 auto_go from exploration.
# Conclusion: safe zone is clearly the productive region; exploration adds little.
#
# =============================================================================
# CHANGES FOR CALIBRATION B
# =============================================================================
#
#  1. DISABLE EXPLORATION ZONE – set `enabled: false`.
#  2. Increase samples_per_zone to 500 (all in safe).
#  3. Lower min_significant_trades to 20 (from 30).
#  4. Relax constraints based on Stage 1 distributions:
#       min_win_rate: 0.18 → 0.15
#       min_expectancy: -2.0 → -3.0
#       min_trades_per_week: 1.5 → 1.0
#       max_losing_streak: 35 → 40
#  5. Update _SIGMOID_SCALE to 172 in consistency_scorer.py (from 163).
#  6. Increase GA budget (population 70, generations 40, stagnation 12).
#  7. Keep parameter ranges identical to raw A (no tightening yet).
#
# =============================================================================
# KEY QUESTIONS FOR CALIBRATION B
# =============================================================================
#
#  1. Does Stage 1 pass rate rise to 30–40%?
#  2. Do top safe candidates achieve ≥4 windows evaluated (out of 13)?
#  3. Can we obtain multiple auto_go candidates with windows_evaluated ≥6?
#  4. Does the exploration zone remain unnecessary (i.e., no auto_go from
#     any surviving exploration candidate)?
#
# RUNTIME ESTIMATE: 10–14 hours at max_workers=2
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"

strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 2
  log_level: "INFO"

stages:
  random_search:     true
  mc_prefilter:      false
  genetic_algorithm: true
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true

random_search:
  method: "lhs"
  samples_per_zone: 500                # all in safe zone
  min_significant_trades: 20            # reduced from 30
  seed: 42

genetic:
  population_size: 70                   # increased from 60
  generations: 40                        # increased from 30
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 12             # increased from 10
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44

walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50
  windows:
    - {id: "W01", start: "2023-01-02", end: "2023-03-31"}
    - {id: "W02", start: "2023-04-03", end: "2023-06-30"}
    - {id: "W03", start: "2023-07-03", end: "2023-09-29"}
    - {id: "W04", start: "2023-10-02", end: "2023-12-29"}
    - {id: "W05", start: "2024-01-02", end: "2024-03-28"}
    - {id: "W06", start: "2024-04-01", end: "2024-06-28"}
    - {id: "W07", start: "2024-07-01", end: "2024-09-30"}
    - {id: "W08", start: "2024-10-01", end: "2024-12-31"}
    - {id: "W09", start: "2025-01-02", end: "2025-03-31"}
    - {id: "W10", start: "2025-04-01", end: "2025-06-30"}
    - {id: "W11", start: "2025-07-01", end: "2025-09-30"}
    - {id: "W12", start: "2025-10-01", end: "2025-12-31"}
    - {id: "W13", start: "2026-01-02", end: "2026-02-28"}

monte_carlo:
  deep:
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45

sensitivity:
  input_count: 10
  max_steps: 1
  spike_threshold: 0.15
  seed: 46

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.15               # lowered from 0.18
      max_losing_streak: 40             # raised from 35
      min_trades_per_week: 1.0           # lowered from 1.5
      min_expectancy: -3.0              # lowered from -2.0
      min_profit_factor: 0.75
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 400.0
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.40
      borderline_wfo_floor: 0.25
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  e2e_test:
    description: "Pipeline validation only — NOT FOR TRADING USE"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.20
      max_drawdown: 0.20
      win_rate: 0.20
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.05
      max_drawdown: 0.99
      max_losing_streak: 9999
      min_trades_per_week: 0.1
      min_expectancy: -10.0
      min_profit_factor: 0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.25
      variance: 0.25
      worst_drawdown: 0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor: 0.01
      borderline_wfo_floor: 0.005
      go_mc_ruin_ceiling: 0.99
      borderline_mc_ruin_ceiling: 0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  safe:
    # Filters active: DPO + CCI + MACD (all always on)
    enabled: true
    parameters:
      atr_length:           {type: int,   min: 8,   max: 20,  step: 1}
      atr_multiplier:       {type: float, min: 1.5, max: 2.8, step: 0.1}
      rr_target:            {type: float, min: 2.5, max: 6.0, step: 0.1}
      risk_percentile:      {type: float, min: 0.30, max: 0.80, step: 0.01}
      dpo_length:           {type: int,   min: 14,  max: 30,  step: 1}
      dpo_smooth:           {type: int,   min: 2,   max: 20,  step: 1}
      dpo_threshold:        {type: float, min: 0.10, max: 0.30, step: 0.02}
      cci_length:           {type: int,   min: 10,  max: 25,  step: 1}
      cci_overbought:       {type: int,   min: 80,  max: 120, step: 2}
      cci_oversold:         {type: int,   min: -120, max: -80, step: 2}
      macd_fast:            {type: int,   min: 8,   max: 16,  step: 1}
      macd_slow:            {type: int,   min: 20,  max: 30,  step: 1}
      macd_signal:          {type: int,   min: 6,   max: 12,  step: 1}
  exploration:
    enabled: false
  discovery:
    enabled: false