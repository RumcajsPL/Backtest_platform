# =============================================================================
# backtest_production_v1.yaml — Backtesting & Optimization Framework
# Version: 1.0.0
# Date: 2026-03-07  (Block 9K / 9L — production YAML)
#
# Source of truth: docs/backtesting/TECHNICAL_SPEC.md
# Schema reference: TECHNICAL_SPEC.md Section 5
#
# USAGE:
#   python scripts/runners/run_backtester.py
#
# STATUS: V1 PRODUCTION
#   All P1/P2/P3 issues resolved (Block 9K patches applied).
#   Validated across 5 calibration runs (runs 4e7135ed through b3237ec9).
#   Two zones enabled: safe (validated) + exploration (wider ranges, same filters).
#   Discovery zone remains disabled — enable only for dedicated exploration runs.
#
# HISTORY OF CHANGES FROM backtest_1st_run.yaml:
#   sensitivity.max_steps:         2  → 1    [OPT-01: Stage 6 timing]
#   zones.safe.rr_target.max:      7.0 → 8.5 [RR-CEILING: spike evidence runs 2ab4fd0e/b3237ec9]
#   zones.exploration:             disabled → enabled [9L step 4]
#   exploration zone:              DPO+Bollinger+Choppiness+RSI+ATR/RR (wider ranges)
#   Filters in exploration:        all enabled=true, no toggles (confirmed DAX filters)
#
# CALIBRATION HISTORY:
#   _SIGMOID_SCALE = 131.0        — run 87712cab (2026-03-07)
#   min_win_rate   = 0.15         — eased from 0.45 (B8B-003/B8B-012, restore after V2-RAR)
#   wfo_collapse_drawdown_threshold = 400.0 pts (DAX, COLLAPSE-UNIT fix Block 9J)
#
# PENDING CALIBRATION (after first production run with exploration enabled):
#   - Review Stage 1 pass rate with ~400 candidates — re-tighten min_win_rate if >15% pass
#   - Review exploration zone collapse rate — adjust wfo_collapse_drawdown_threshold if needed
#   - Recalibrate _SIGMOID_SCALE if net_pnl distribution shifts materially
#   - B8B-003: normalisation_expectancy_ref_pts — review after exploration zone results
# =============================================================================


# ── Identity ──────────────────────────────────────────────────────────────────
backtester_version: "1.0.0"
scenario: "capital_accumulation"


# ── Strategy base config ──────────────────────────────────────────────────────
strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"


# ── Run settings ──────────────────────────────────────────────────────────────
run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 6
  log_level: "INFO"


# ── Stage enables ─────────────────────────────────────────────────────────────
stages:
  random_search: true
  mc_prefilter: true
  genetic_algorithm: true
  walk_forward: true
  monte_carlo_deep: true
  sensitivity: true
  report: true


# ── Random Search (Stage 1) ───────────────────────────────────────────────────
random_search:
  method: "lhs"
  samples_per_zone: 200             # 200 × 2 zones = ~400 Stage 1 candidates total
  min_significant_trades: 30
  seed: 42


# ── MC Pre-Filter (Stage 2) ───────────────────────────────────────────────────
mc_prefilter:
  input_count: 120                  # Top 120 from ~400 Stage 1 passers
  iterations: 300
  perturbation_profile: "default"
  seed: 43


# ── Genetic Algorithm (Stage 3) ───────────────────────────────────────────────
genetic:
  population_size: 60
  generations: 30
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 10
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44


# ── Walk-Forward Optimisation (Stage 4) ───────────────────────────────────────
walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50

  # 5 windows covering 2025-09-15 → 2025-12-17 (3-month DAX data slice)
  windows:
    - id: "W01"
      start: "2025-09-15"
      end:   "2025-10-03"
    - id: "W02"
      start: "2025-10-06"
      end:   "2025-10-24"
    - id: "W03"
      start: "2025-10-27"
      end:   "2025-11-14"
    - id: "W04"
      start: "2025-11-17"
      end:   "2025-12-05"
    - id: "W05"
      start: "2025-12-08"
      end:   "2025-12-17"


# ── Monte Carlo Deep (Stage 5) ────────────────────────────────────────────────
monte_carlo:
  deep:
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45


# ── Parameter Sensitivity (Stage 6) ──────────────────────────────────────────
# NOTE: sensitivity.spike_threshold is documentation only — orchestrator reads
# from scenario.verdict_thresholds.sensitivity_spike_threshold (B9A-003).
sensitivity:
  input_count: 5
  max_steps: 1                      # OPT-01: reduced from 2 → 1 (±1 step only)
                                    # Halves perturbation count (~90 vs ~180)
                                    # Stage 6 timing: ~120-150s (was ~300s at max_steps=2)
  spike_threshold: 0.15             # Documentation only — orchestrator reads from scenario
  seed: 46


# ── Output (Stage 7) ──────────────────────────────────────────────────────────
output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false


# ── Perturbation Profiles ─────────────────────────────────────────────────────
perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0


# ── Scenarios ─────────────────────────────────────────────────────────────────
scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.15          # eased from 0.45 — observed range 0.15–0.25
      max_drawdown: 0.15          # ~25% of candidates already below this
      max_losing_streak: 50       # eased from 7 — observed avg=35, max=61
      min_trades_per_week: 3.0    # observed min=12.5, no issue
      min_expectancy: 0.0         # eased from 0.40
      min_profit_factor: 0.90     # eased from 1.30 — observed max=1.16
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.65
      borderline_wfo_floor: 0.40
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  swing_trading:
    description: "Maximise R:R on high-quality directional signals"
    fitness_weights:
      net_pnl: 0.15
      expectancy: 0.35
      max_drawdown: 0.15
      win_rate: 0.10
      trade_frequency: 0.05
      profit_factor: 0.20
    constraints:
      min_win_rate: 0.38
      max_drawdown: 0.20
      max_losing_streak: 10
      min_trades_per_week: 1.0
      min_expectancy: 0.8
      min_profit_factor: 1.5
    mc_prefilter_ruin_threshold: 0.30
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.40
      variance: 0.25
      worst_drawdown: 0.20
      fraction_positive: 0.15
    verdict_thresholds:
      go_wfo_floor: 0.60
      borderline_wfo_floor: 0.38
      go_mc_ruin_ceiling: 0.07
      borderline_mc_ruin_ceiling: 0.18
      sensitivity_spike_threshold: 0.18
    report_emphasis:
      - actual_expectancy
      - actual_profit_factor
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - median_window_return

  conservative:
    description: "Preserve capital; avoid ruin above all else"
    fitness_weights:
      net_pnl: 0.10
      expectancy: 0.15
      max_drawdown: 0.35
      win_rate: 0.25
      trade_frequency: 0.05
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.52
      max_drawdown: 0.10
      max_losing_streak: 5
      min_trades_per_week: 2.0
      min_expectancy: 0.3
      min_profit_factor: 1.2
    mc_prefilter_ruin_threshold: 0.15
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.20
      variance: 0.35
      worst_drawdown: 0.30
      fraction_positive: 0.15
    verdict_thresholds:
      go_wfo_floor: 0.70
      borderline_wfo_floor: 0.50
      go_mc_ruin_ceiling: 0.03
      borderline_mc_ruin_ceiling: 0.10
      sensitivity_spike_threshold: 0.12
    report_emphasis:
      - mc_deep_ruin_probability
      - actual_max_drawdown
      - wfo_worst_window_drawdown
      - actual_win_rate
      - wfo_consistency_score

  e2e_test:
    # Pipeline validation only — NOT FOR TRADING USE
    description: "Pipeline validation only — loose constraints for E2E testing"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.20
      max_drawdown: 0.20
      win_rate: 0.20
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.05
      max_drawdown: 0.99
      max_losing_streak: 9999
      min_trades_per_week: 1.0
      min_expectancy: -10.0
      min_profit_factor: 0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.25
      variance: 0.25
      worst_drawdown: 0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor: 0.01
      borderline_wfo_floor: 0.005
      go_mc_ruin_ceiling: 0.99
      borderline_mc_ruin_ceiling: 0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown


# ── Parameter Zones ───────────────────────────────────────────────────────────
# All parameter names verified against strategy_runner._PARAM_KEY_MAP ✓
#
# safe zone:        validated across 5 runs (blocks 9H–9L)
#                   rr_target.max extended 7.0→8.5 (RR-CEILING, runs 2ab4fd0e/b3237ec9)
#
# exploration zone: ENABLED (Block 9L step 4)
#                   Wider ranges around confirmed DAX-effective parameter values.
#                   Anchored on operator experience:
#                     dpo: length~19, smooth~14, threshold~0.25
#                     bollinger: length~11, width_ma~38, multiplier~1.0
#                     choppiness: length~16, threshold~58.8
#                     atr: length~9, multiplier~1.9
#                   All filters enabled=true — no toggle params in this zone.
#                   RSI included: producing real signal since run 2ab4fd0e.
#
# discovery zone:   DISABLED — wide ranges, enable only for dedicated exploration.

zones:
  safe:
    enabled: true
    # 9 parameters. Conservative ranges. Validated across 5 calibration runs.
    parameters:
      rsi_period:           {type: int,   min: 8,  max: 20, step: 1}
      rsi_overbought:       {type: int,   min: 51, max: 80, step: 1}
      rsi_oversold:         {type: int,   min: 20, max: 49, step: 1}
      atr_length:           {type: int,   min: 6,  max: 20, step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 2.5, step: 0.1}
      rr_target:            {type: float, min: 3.0, max: 8.5, step: 0.1}  # RR-CEILING: extended from 7.0
      risk_percentile:      {type: float, min: 0.2, max: 0.65, step: 0.01}
      bollinger_length:     {type: int,   min: 8,  max: 20, step: 1}
      bollinger_multiplier: {type: float, min: 0.3, max: 1.1, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 10, max: 50, step: 1}      # step corrected: was 0.1 (int type mismatch)

  exploration:
    enabled: true   # Block 9L step 4. B9B-001 patch prerequisite applied.
    # Wider ranges anchored on confirmed DAX-effective settings.
    # All filters enabled=true (no toggle params — consistent filter set across all candidates).
    # DPO + Bollinger + Choppiness + RSI + ATR/RR confirmed effective for DAX.
    # adx/supertrend/cci/macd/ma/pivot remain disabled in strategy_template.yaml
    # and are NOT included here — they are not confirmed effective for this asset/TF.
    parameters:
      # ── RSI ───────────────────────────────────────────────────────────────
      # Wider than safe zone. Producing real signal since run 2ab4fd0e.
      # Top winners: rsi_period 10-16, overbought 56-79, oversold 25-40.
      rsi_period:           {type: int,   min: 8,  max: 24, step: 1}
      rsi_overbought:       {type: int,   min: 52, max: 82, step: 1}
      rsi_oversold:         {type: int,   min: 18, max: 48, step: 1}

      # ── ATR (risk management) ─────────────────────────────────────────────
      # Operator experience: atr_length~9, atr_multiplier~1.9.
      # Safe zone winners: atr_length 10-20, atr_multiplier 1.7-2.4.
      # Exploration extends lower (atr_length down to 7) to capture operator optimum.
      atr_length:           {type: int,   min: 7,  max: 24, step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 3.0, step: 0.1}

      # ── R:R target ────────────────────────────────────────────────────────
      # Safe zone max extended to 8.5. Exploration goes to 10.0 for discovery.
      # Top winners: rr_target 4.3-6.9. Spike evidence suggests optimum above 7.0.
      rr_target:            {type: float, min: 3.0, max: 10.0, step: 0.1}

      # ── Risk percentile ───────────────────────────────────────────────────
      # Wider than safe (0.15-0.70 vs 0.20-0.65).
      # Top winners: 0.23-0.65. Low end (0.15-0.20) worth exploring.
      risk_percentile:      {type: float, min: 0.15, max: 0.70, step: 0.01}

      # ── Bollinger filter ─────────────────────────────────────────────────
      # Operator experience: length~11, width_ma~38, multiplier~1.0.
      # Safe zone winners: length 8-16, width_ma 14-46, multiplier 0.3-0.7.
      # Exploration anchored around operator optimum with wider bounds.
      bollinger_length:     {type: int,   min: 8,  max: 22, step: 1}
      bollinger_multiplier: {type: float, min: 0.3, max: 1.5, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 15, max: 55, step: 1}

      # ── Choppiness filter ────────────────────────────────────────────────
      # Operator experience: length~16, threshold~58.8.
      # Not in safe zone (safe zone uses bollinger_width_ma as choppiness proxy).
      # Exploration adds choppiness as an explicit search dimension.
      # threshold range: 55.0-65.0 covers standard Choppiness Index levels.
      choppiness_length:    {type: int,   min: 12, max: 22, step: 1}
      choppiness_threshold: {type: float, min: 55.0, max: 65.0, step: 0.5}

      # ── DPO filter ───────────────────────────────────────────────────────
      # Operator experience: length~19, smooth~14, threshold~0.25.
      # Not in safe zone. Exploration adds DPO as an explicit search dimension.
      # smooth range spans both short (3 in template) and longer smoothing.
      # threshold range: 0.15-0.40 around operator optimum of 0.25.
      dpo_length:           {type: int,   min: 15, max: 25, step: 1}
      dpo_smooth:           {type: int,   min: 8,  max: 18, step: 1}
      dpo_threshold:        {type: float, min: 0.15, max: 0.40, step: 0.05}

  discovery:
    enabled: false   # Wide ranges + full filter suite. Enable only for dedicated runs.
    parameters:
      rsi_period:           {type: int,   min: 5,  max: 30, step: 1}
      rsi_overbought:       {type: int,   min: 55, max: 90, step: 5}
      rsi_oversold:         {type: int,   min: 10, max: 45, step: 5}
      atr_length:           {type: int,   min: 5,  max: 35, step: 1}
      atr_multiplier:       {type: float, min: 0.5, max: 3.5, step: 0.1}
      rr_target:            {type: float, min: 2.0, max: 12.0, step: 0.1}
      risk_percentile:      {type: float, min: 0.05, max: 0.50, step: 0.05}
      bollinger_length:     {type: int,   min: 5,  max: 40, step: 2}
      bollinger_multiplier: {type: float, min: 0.1, max: 1.5, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 15, max: 60, step: 5}
      adx_enabled:          {type: choice, choices: [true, false]}
      adx_length:           {type: int,   min: 8,  max: 25, step: 2}
      adx_threshold:        {type: float, min: 10.0, max: 35.0, step: 2.5}
      choppiness_enabled:   {type: choice, choices: [true, false]}
      choppiness_length:    {type: int,   min: 8,  max: 25, step: 2}
      choppiness_threshold: {type: float, min: 50.0, max: 70.0, step: 2.5}
      supertrend_enabled:   {type: choice, choices: [true, false]}
      supertrend_atr_length: {type: int,  min: 5,  max: 20, step: 1}
      supertrend_factor:    {type: float, min: 1.5, max: 5.0, step: 0.5}
      cci_enabled:          {type: choice, choices: [true, false]}
      cci_length:           {type: int,   min: 10, max: 30, step: 5}
      cci_overbought:       {type: int,   min: 80, max: 120, step: 10}
      cci_oversold:         {type: int,   min: -120, max: -80, step: 10}
      macd_enabled:         {type: choice, choices: [true, false]}
      macd_fast:            {type: int,   min: 8,  max: 16, step: 2}
      macd_slow:            {type: int,   min: 20, max: 30, step: 2}
      macd_signal:          {type: int,   min: 6,  max: 12, step: 1}
      ma_enabled:           {type: choice, choices: [true, false]}
      ma_length:            {type: int,   min: 15, max: 50, step: 5}
      ma_slope_length:      {type: int,   min: 5,  max: 20, step: 5}
      pivot_enabled:        {type: choice, choices: [true, false]}
      pivot_reversal_pct:   {type: float, min: 0.20, max: 0.60, step: 0.05}
      pivot_order:          {type: int,   min: 3,  max: 8,  step: 1}
      dpo_enabled:          {type: choice, choices: [true, false]}
      dpo_length:           {type: int,   min: 14, max: 30, step: 2}
      dpo_smooth:           {type: int,   min: 2,  max: 5,  step: 1}
      dpo_threshold:        {type: float, min: 0.1, max: 0.5, step: 0.1}