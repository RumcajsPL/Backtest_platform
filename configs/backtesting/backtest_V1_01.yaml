# =============================================================================
# backtest_production_fullhistory_v2.yaml
# Version: 2.0.0
# Date: 2026-03-08  (Block 9M)
#
# CHANGES FROM v1:
#   Same constraint fixes as backtest_calibration_fullhistory_v2.yaml:
#     - max_drawdown removed from Stage 1 constraints
#     - max_losing_streak raised 50 → 200
#   These changes apply only to full-history YAMLs. backtest_production_v1.yaml
#   (3-month slice) is UNCHANGED — its constraints are correctly calibrated.
#
# PRE-REQUISITES — complete in order before running:
#
#   1. Run backtest_calibration_fullhistory_v2.yaml first.
#
#   2. Update consistency_scorer.py with recalibrated constants:
#        _SIGMOID_SCALE: float = <stdev(net_pnl) × 0.5>   # from calibration run Stage 4
#        _MAX_EXPECTED_DRAWDOWN: float = 2_500.0           # raised from 1_000.0
#      Both changes required before this run will produce trustworthy WFO scores.
#
#   3. Review wfo_collapse_drawdown_threshold after calibration run.
#      Check Stage 4 worst_dd values from calibration run.
#      This threshold is per-window (3-month), so 400.0 pts should still be correct.
#      Raise only if calibration run shows valid candidates consistently collapsing
#      at worst_dd near 400 pts across multiple windows.
#
# RUNTIME ESTIMATE: 10-14 hours (13 windows × 30 Stage 4 candidates = 390 evaluations)
#   Stage 1:  ~40-60 min  (400 candidates, parallelised across max_workers=6)
#   Stage 2:  ~15-20 min  (120 input candidates)
#   Stage 3:  ~30-45 min  (GA — more params per exploration zone candidate)
#   Stage 4:  ~5-7 hrs    (dominant — 13 windows vs 5 in production_v1)
#   Stage 5:  ~20-30 min  (10 candidates × 3000 MC iterations)
#   Stage 6:  ~15-20 min  (5 candidates × ±1 step)
#   Stage 7:  ~5 min
#
# KEY QUESTIONS THIS RUN ANSWERS:
#   1. Do V1 auto_go candidates survive 38 months across 3 DAX regimes?
#   2. Which regime windows cause collapse or degradation?
#      W01-W04 (2023): directional recovery — expected to be favourable
#      W05-W08 (2024): choppy, rate-decision driven — KEY STRESS TEST
#      W09-W12 (2025): range-bound with momentum bursts
#   3. Does the exploration zone (DPO + Choppiness) hold up through 2024?
#   4. Are W12 (Oct-Dec 2025) WFO scores consistent with production_v1 runs?
#      (cross-reference point — same data as current 5-window slice)
#   5. Does W13 (Jan-Feb 2026) produce REJECTED_INSUFFICIENT_TRADES as expected?
#
# CONSTRAINT NOTES (full-history specific):
#   max_drawdown: REMOVED from Stage 1. Stage 4 WFO filters via
#     wfo_collapse_drawdown_threshold (400 pts per-window — correct granularity).
#     Restore max_drawdown to Stage 1 only if date range returns to ≤ 3 months.
#   max_losing_streak: raised to 200. Full-history continuous evaluation produces
#     streaks of 44 avg / 78 max (run d1ce2b1d). Stage 4 per-window is the right
#     granularity for streak assessment.
#   All other constraints: unchanged from production_v1.
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"

strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 6
  log_level: "INFO"

stages:
  random_search:     true
  mc_prefilter:      true
  genetic_algorithm: true
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true

random_search:
  method: "lhs"
  samples_per_zone: 200           # 200 × 2 zones = 400 total
  min_significant_trades: 30
  seed: 42

mc_prefilter:
  input_count: 120
  iterations: 300
  perturbation_profile: "default"
  seed: 43

genetic:
  population_size: 60
  generations: 30
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 10
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44

walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50

  # 13 rolling 3-month windows — 2023-01-02 → 2026-02-28
  #
  # Regime map:
  #   W01-W04  2023      DAX recovery trend — directional, lower noise
  #   W05-W08  2024      ECB rate cycle, choppy — KEY STRESS TEST
  #   W09-W11  2025 H1   Range-bound with momentum bursts
  #   W12      2025 Q4   Cross-reference: overlaps production_v1 5-window slice
  #   W13      2026 Q1   Partial (~2 months) — REJECTED_INSUFFICIENT_TRADES expected
  #
  windows:
    - id: "W01"
      start: "2023-01-02"
      end:   "2023-03-31"
    - id: "W02"
      start: "2023-04-03"
      end:   "2023-06-30"
    - id: "W03"
      start: "2023-07-03"
      end:   "2023-09-29"
    - id: "W04"
      start: "2023-10-02"
      end:   "2023-12-29"
    - id: "W05"
      start: "2024-01-02"
      end:   "2024-03-28"
    - id: "W06"
      start: "2024-04-01"
      end:   "2024-06-28"
    - id: "W07"
      start: "2024-07-01"
      end:   "2024-09-30"
    - id: "W08"
      start: "2024-10-01"
      end:   "2024-12-31"
    - id: "W09"
      start: "2025-01-02"
      end:   "2025-03-31"
    - id: "W10"
      start: "2025-04-01"
      end:   "2025-06-30"
    - id: "W11"
      start: "2025-07-01"
      end:   "2025-09-30"
    - id: "W12"
      start: "2025-10-01"
      end:   "2025-12-31"    # Cross-reference vs production_v1
    - id: "W13"
      start: "2026-01-02"
      end:   "2026-02-28"    # Partial — REJECTED_INSUFFICIENT_TRADES expected

monte_carlo:
  deep:
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45

sensitivity:
  input_count: 5
  max_steps: 1
  spike_threshold: 0.15         # Documentation only — orchestrator reads from scenario
  seed: 46

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.15
      # max_drawdown: REMOVED — see file header for rationale
      max_losing_streak: 200     # Raised from 50 — full-history continuous evaluation
      min_trades_per_week: 3.0
      min_expectancy: 0.0
      min_profit_factor: 0.90
    mc_prefilter_ruin_threshold: 0.25
    wfo_collapse_drawdown_threshold: 400.0    # Per-window — review after calibration run v2
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.65
      borderline_wfo_floor: 0.40
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  e2e_test:
    description: "Pipeline validation only — NOT FOR TRADING USE"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.20
      max_drawdown: 0.20
      win_rate: 0.20
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.05
      max_drawdown: 0.99
      max_losing_streak: 9999
      min_trades_per_week: 1.0
      min_expectancy: -10.0
      min_profit_factor: 0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.25
      variance: 0.25
      worst_drawdown: 0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor: 0.01
      borderline_wfo_floor: 0.005
      go_mc_ruin_ceiling: 0.99
      borderline_mc_ruin_ceiling: 0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  safe:
    enabled: true
    parameters:
      rsi_period:           {type: int,   min: 8,  max: 20, step: 1}
      rsi_overbought:       {type: int,   min: 51, max: 80, step: 1}
      rsi_oversold:         {type: int,   min: 20, max: 49, step: 1}
      atr_length:           {type: int,   min: 6,  max: 20, step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 2.5, step: 0.1}
      rr_target:            {type: float, min: 3.0, max: 8.5, step: 0.1}
      risk_percentile:      {type: float, min: 0.2, max: 0.65, step: 0.01}
      bollinger_length:     {type: int,   min: 8,  max: 20, step: 1}
      bollinger_multiplier: {type: float, min: 0.3, max: 1.1, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 10, max: 50, step: 1}

  exploration:
    enabled: true
    parameters:
      rsi_period:           {type: int,   min: 8,  max: 24, step: 1}
      rsi_overbought:       {type: int,   min: 52, max: 82, step: 1}
      rsi_oversold:         {type: int,   min: 18, max: 48, step: 1}
      atr_length:           {type: int,   min: 7,  max: 24, step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 3.0, step: 0.1}
      rr_target:            {type: float, min: 3.0, max: 10.0, step: 0.1}
      risk_percentile:      {type: float, min: 0.15, max: 0.70, step: 0.01}
      bollinger_length:     {type: int,   min: 8,  max: 22, step: 1}
      bollinger_multiplier: {type: float, min: 0.3, max: 1.5, step: 0.1}
      bollinger_width_ma:   {type: int,   min: 15, max: 55, step: 1}
      choppiness_length:    {type: int,   min: 12, max: 22, step: 1}
      choppiness_threshold: {type: float, min: 55.0, max: 65.0, step: 0.5}
      dpo_length:           {type: int,   min: 15, max: 25, step: 1}
      dpo_smooth:           {type: int,   min: 8,  max: 18, step: 1}
      dpo_threshold:        {type: float, min: 0.15, max: 0.40, step: 0.05}

  discovery:
    enabled: false