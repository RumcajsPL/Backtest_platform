# =============================================================================
# backtest_V1_03.yaml
# Version: 1.0.0
# Date: 2026-03-14  (Weekend exploratory run — no-HTF configuration)
#
# PARENT RUN: 547c3161-7ef5-478b-ac3c-182f602e0b60  (backtest_V1_02.yaml)
# PRODUCTION RUN (reference): b651ec5c (backtest_V1_01.yaml)
#
# GOAL: Exploration / learning — NOT for promoting candidates to paper trading
#       without independent review. No-HTF configuration (strategy_TF=1min,
#       htf_TF=1min) confirmed as interesting in parent run.
#
# KEY CHANGES FROM V1_02:
#
#   CHANGE 1: Two zones (safe + exploration) → one zone (focused)
#     safe zone produced zero top candidates in run 547c3161.
#     All auto_go and borderline candidates came from exploration zone.
#     Merging into one zone with tighter bounds. Samples increased 200→300
#     to maintain search density in the now-smaller space.
#
#   CHANGE 2: rr_target 2.0–10.0 → 2.5–6.0
#     Top-5 WFO candidates in parent run: 2.8, 3.0, 3.6, 5.2, 5.3.
#     Nothing useful observed above 5.3. Lower tail at 2.0–2.4 produced
#     only bottom-quartile WFO candidates.
#
#   CHANGE 3: adx_threshold 17.0–30.0 → 22.0–30.0
#     All top candidates (WFO > 0.60) had adx_threshold >= 24.8.
#     17.0–22.0 range populated only by low-WFO / failed candidates.
#
#   CHANGE 4: atr_multiplier 1.2–3.0 → 1.2–2.8
#     Values 2.9–3.0 appeared only in bottom-5 WFO candidates.
#     1.3 (0984ffd0af4c auto_go) confirmed — low end of range kept.
#
#   CHANGE 5: dpo_threshold 0.10–0.40 → 0.10–0.25
#     Top candidates clustered: 0.13, 0.11, 0.21, 0.15, 0.21.
#     0.25–0.40 range was dead space in parent run.
#
#   CHANGE 6: choppiness_threshold 50.0–67.0 → 52.0–65.0
#     Trimming tails only — confirmed active range 52.4–63.1 in parent run.
#
#   CHANGE 7: GA population 60→70, generations 30→35
#     Tighter search space allows more thorough GA refinement at same
#     compute cost.
#
#   CHANGE 8: samples_per_zone 200→300
#     Single zone replaces two zones of 200 each. 300 gives better LHS
#     coverage of the narrowed space while keeping Stage 1 runtime similar.
#
# UNCHANGED (deliberate):
#   _SIGMOID_SCALE = 310.0 in consistency_scorer.py — confirmed hardcoded.
#   Results ARE directly comparable to b651ec5c and 547c3161.
#   All 13 WFO windows — W10 (2025 Q2) is a known stress window; keep it.
#   All constraint thresholds — calibrated, do not touch without re-analysis.
#   max_workers: 2 — OOM constraint unchanged until V2 shared memory.
#   mc_prefilter: false — same reasoning as V1_02 (compounds 38-month drawdown).
#
# NO-HTF NOTE:
#   This run uses strategy_TF=1min with htf_TF=1min (effectively no HTF).
#   Confirmed as interesting in parent run 547c3161.
#   broker_support_config.yaml will need htf_interval updated if any
#   candidate from this run is promoted to paper trading.
#
# RUNTIME ESTIMATE: 12–16 hours at max_workers=2
#   Stage 1:  ~60–75 min  (300 candidates, 2 workers)
#   Stage 2:  DISABLED
#   Stage 3:  ~3–4 hrs    (GA, 35 generations × 70 population, 2 workers)
#   Stage 4:  ~7–9 hrs    (13 windows × 30 candidates, 2 workers — dominant)
#   Stage 5:  ~30–45 min  (10 candidates × 3000 MC iterations)
#   Stage 6:  ~20–30 min  (10 candidates × ±1 step)
#   Stage 7:  ~5 min
#
# KEY QUESTIONS THIS RUN ANSWERS:
#   1. Does the no-HTF configuration produce reproducible auto_go candidates
#      in a focused search, or was 0984ffd0af4c a one-off?
#   2. Does narrowing rr_target to 2.5–6.0 concentrate quality or miss a tail?
#   3. Do any candidates survive W10 (2025 Q2 stress window) with positive P&L?
#   4. Does 0984ffd0af4c-like parameter space (atr=10, mult=1.3, rr=5.2)
#      reproduce under denser GA search?
# =============================================================================

backtester_version: "1.0.0"
scenario: "capital_accumulation"

strategy:
  base_yaml_path: "configs/strategies/strategy_template.yaml"

run:
  mode: "full_pipeline"
  output_dir: "outputs/backtesting"
  temp_dir: "temp/backtesting"
  retain_temp_yamls: false
  max_workers: 2       # MANDATORY — OOM at 6 confirmed. Do not raise until V2 shared memory.
  log_level: "INFO"

stages:
  random_search:     true
  mc_prefilter:      false   # Disabled — compounds 38-month drawdown into false ruin signals
  genetic_algorithm: true
  walk_forward:      true
  monte_carlo_deep:  true
  sensitivity:       true
  report:            true

random_search:
  method: "lhs"
  samples_per_zone: 300      # Single focused zone. 300 = better LHS density than 200×2.
  min_significant_trades: 30
  seed: 42

genetic:
  population_size: 70        # Increased from 60 — tighter space allows more thorough search
  generations: 35            # Increased from 30
  elite_fraction: 0.10
  mutation_rate: 0.15
  crossover_rate: 0.70
  tournament_size: 5
  stagnation_generations: 10
  diversity_penalty_weight: 0.10
  diversity_distance_threshold: 0.15
  seed: 44

walk_forward:
  input_count: 30
  enforce_oos_gate: false
  oos_degradation_threshold: 0.50

  # 13 rolling 3-month windows — 2023-01-02 → 2026-02-28
  # Kept identical to V1_01 and V1_02 for comparability.
  #
  # Regime map:
  #   W01-W04  2023      DAX recovery trend — directional, lower noise
  #   W05-W08  2024      ECB rate cycle, choppy — KEY STRESS TEST
  #   W09-W11  2025 H1   Range-bound with momentum bursts
  #   W12      2025 Q4   Cross-reference: overlaps production_v1 5-window slice
  #   W13      2026 Q1   Partial (~2 months) — REJECTED_INSUFFICIENT_TRADES expected
  #   W10      2025 Q2   Structural stress window — most candidates fail badly here
  #
  windows:
    - id: "W01"
      start: "2023-01-02"
      end:   "2023-03-31"
    - id: "W02"
      start: "2023-04-03"
      end:   "2023-06-30"
    - id: "W03"
      start: "2023-07-03"
      end:   "2023-09-29"
    - id: "W04"
      start: "2023-10-02"
      end:   "2023-12-29"
    - id: "W05"
      start: "2024-01-02"
      end:   "2024-03-28"
    - id: "W06"
      start: "2024-04-01"
      end:   "2024-06-28"
    - id: "W07"
      start: "2024-07-01"
      end:   "2024-09-30"
    - id: "W08"
      start: "2024-10-01"
      end:   "2024-12-31"
    - id: "W09"
      start: "2025-01-02"
      end:   "2025-03-31"
    - id: "W10"
      start: "2025-04-01"
      end:   "2025-06-30"
    - id: "W11"
      start: "2025-07-01"
      end:   "2025-09-30"
    - id: "W12"
      start: "2025-10-01"
      end:   "2025-12-31"
    - id: "W13"
      start: "2026-01-02"
      end:   "2026-02-28"    # Partial — REJECTED_INSUFFICIENT_TRADES expected

monte_carlo:
  deep:
    input_count: 10
    iterations: 3000
    perturbation_profile: "default"
    ruin_threshold: 0.20
    seed: 45

sensitivity:
  input_count: 10
  max_steps: 1
  spike_threshold: 0.15
  seed: 46

output:
  shortlist_count: 5
  formats:
    html: true
    json: true
    parquet: true
  save_intermediates:
    equity_curves: false
    trade_logs: false
    candidate_yamls: false

perturbation_profiles:
  default:
    version: "1.0"
    spread_noise_bps_range: [0, 3]
    slippage_pips_range: [0, 1]
    risk_noise_fraction: 0.05
    shuffle_trades: true
    resample_returns: true
    execution_delay_bars: 0

scenarios:
  capital_accumulation:
    description: "Steadily grow account balance with controlled risk"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.25
      max_drawdown: 0.20
      win_rate: 0.15
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.18         # Calibrated — avg=0.172 in parent run, removes bottom ~5%
      max_losing_streak: 50     # Calibrated — 38-month max observed=94
      min_trades_per_week: 3.0   # Unchanged — 1 failure observed across all runs
      min_expectancy: -2.0       # Calibrated — avg=-1.69, targets top ~65%
      min_profit_factor: 0.75    # Calibrated — no failures at this threshold
    mc_prefilter_ruin_threshold: 0.25   # Retained for reference (Stage 2 disabled)
    wfo_collapse_drawdown_threshold: 400.0
    normalisation_expectancy_ref_pts: 3.0
    wfo_temporal_weights:
      median_return: 0.30
      variance: 0.30
      worst_drawdown: 0.20
      fraction_positive: 0.20
    verdict_thresholds:
      go_wfo_floor: 0.40
      borderline_wfo_floor: 0.25
      go_mc_ruin_ceiling: 0.05
      borderline_mc_ruin_ceiling: 0.15
      sensitivity_spike_threshold: 0.15
    report_emphasis:
      - wfo_consistency_score
      - fraction_positive_windows
      - actual_trades_per_week
      - mc_deep_ruin_probability
      - actual_max_drawdown

  e2e_test:
    description: "Pipeline validation only — NOT FOR TRADING USE"
    fitness_weights:
      net_pnl: 0.20
      expectancy: 0.20
      max_drawdown: 0.20
      win_rate: 0.20
      trade_frequency: 0.10
      profit_factor: 0.10
    constraints:
      min_win_rate: 0.05
      max_drawdown: 0.99
      max_losing_streak: 9999
      min_trades_per_week: 1.0
      min_expectancy: -10.0
      min_profit_factor: 0.05
    mc_prefilter_ruin_threshold: 0.99
    wfo_collapse_drawdown_threshold: 400.0
    wfo_temporal_weights:
      median_return: 0.25
      variance: 0.25
      worst_drawdown: 0.25
      fraction_positive: 0.25
    verdict_thresholds:
      go_wfo_floor: 0.01
      borderline_wfo_floor: 0.005
      go_mc_ruin_ceiling: 0.99
      borderline_mc_ruin_ceiling: 0.999
      sensitivity_spike_threshold: 0.99
    report_emphasis:
      - actual_win_rate
      - actual_trades_per_week
      - wfo_consistency_score
      - mc_deep_ruin_probability
      - actual_max_drawdown

zones:
  focused:
    # Single zone derived from 547c3161 winner analysis.
    # Replaces safe + exploration from V1_02.
    # All bounds evidence-based from top-5 WFO candidates in parent run.
    enabled: true
    parameters:
      atr_length:           {type: int,   min: 5,   max: 24,  step: 1}
      atr_multiplier:       {type: float, min: 1.2, max: 2.8, step: 0.1}   # 2.9-3.0 dead space
      rr_target:            {type: float, min: 2.5, max: 6.0, step: 0.1}   # nothing useful >5.3
      risk_percentile:      {type: float, min: 0.20, max: 0.70, step: 0.01} # winners at both ends
      dpo_length:           {type: int,   min: 10,  max: 30,  step: 1}
      dpo_smooth:           {type: int,   min: 1,   max: 26,  step: 1}
      dpo_threshold:        {type: float, min: 0.10, max: 0.25, step: 0.01} # 0.25-0.40 dead space
      choppiness_length:    {type: int,   min: 8,   max: 26,  step: 1}
      choppiness_threshold: {type: float, min: 52.0, max: 65.0, step: 0.1} # trimmed tails
      cci_length:           {type: int,   min: 10,  max: 30,  step: 1}
      cci_overbought:       {type: int,   min: 50,  max: 150, step: 2}
      cci_oversold:         {type: int,   min: -50, max: -150, step: 2}
      adx_length:           {type: int,   min: 8,   max: 25,  step: 1}
      adx_threshold:        {type: float, min: 22.0, max: 30.0, step: 0.2} # <22 was dead space

  safe:
    enabled: false   # Retired — produced no top candidates in 547c3161

  exploration:
    enabled: false   # Retired — merged into focused zone above

  discovery:
    enabled: false