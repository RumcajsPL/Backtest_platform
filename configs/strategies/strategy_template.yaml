# =============================================================================
# WBWSStrategy — New Architecture Config Template
# Version: 2.0.0 (Phase 5 Final)
# Date: 2026-02-21
#
# Changes from v1.1.0:
#   - Phase 5.4: Removed spread_type/spread_value - now exclusively from broker file
#   - Phase 5.4: Spread section now only has enabled and config_path
#   - All spread values must be defined in configs/spreads/broker_spreads.yaml
# =============================================================================


# -----------------------------------------------------------------------------
# [GENERIC] ASSET
# Required when trade_management.spread.enabled: true.
# symbol must match a key in the broker_spreads.yaml file exactly.
# -----------------------------------------------------------------------------
asset:
  symbol: "DEUIDXEUR"    # DAX 40 — matches key in configs/spreads/broker_spreads.yaml
  pip_size: 0.1          # DAX — minimum tick (0.1 index point)
  point_size: 1.0        # DAX — 1 point = 1.0 index point


# -----------------------------------------------------------------------------
# [GENERIC] DATA
# -----------------------------------------------------------------------------
data:
  paths:
    strategy_ohlcv: "data/processed/ohlcv/DEUIDXEUR_1min_20240101_20260207.parquet"
    htf_ohlcv:      "data/processed/ohlcv/DEUIDXEUR_1H_20240101_20260207.parquet"
    ltf_ohlcv:      "data/processed/ohlcv/DEUIDXEUR_1s_20240101_20260207.parquet"
    artf_ohlcv:     "data/processed/ohlcv/DEUIDXEUR_1ME_20210101_20260207.parquet"

  date_range:
    start: "2025-09-14 08:00:00"   # Format: YYYY-MM-DD HH:MM:SS 
    end:   "2025-12-17 21:00:00"

  timezone: "CET"

  htf_period: "1H"         # HTF resampling period passed to WBWSTrigger
  ltf_timeframe: "1s"      # LTF bar frequency — must match ltf_ohlcv file content
  artf_timeframe: "1ME"    # ARTF bar frequency — must match artf_ohlcv file content


# -----------------------------------------------------------------------------
# [GENERIC] EXECUTION
# -----------------------------------------------------------------------------
execution:
  mode: "analytics"  # "core" | "analytics"


# -----------------------------------------------------------------------------
# [GENERIC] FILTERS
# -----------------------------------------------------------------------------
filters:
  time_filters:
    time_filter:
      enabled: true
      session_start: {hour: 08, minute: 30}
      session_end:   {hour: 20, minute: 30}
    #  excluded_days: ["Saturday", "Sunday"]   # e.g. ["Saturday", "Sunday"] -> placeholder for evolution

  filter_sequence:
    - rsi_filter
    - choppiness_filter
    - bollinger_filter
    - adx_filter
    - supertrend_filter
    - ma_filter
    - pivot_filter
    - cci_filter
    - macd_filter
    - dpo_filter

  technical_filters:
    rsi_filter:
      enabled: true
      length: 14
      overbought: 70
      oversold: 30

    dpo_filter:
      enabled: false
      length: 20
      smooth: 3
      threshold: 0.2

    bollinger_filter:
      enabled: true
      length: 14
      width_ma_length: 30
      filter_multiplier: 0.5

    choppiness_filter:
      enabled: false
      length: 14
      threshold: 61.8

    supertrend_filter:
      enabled: false
      atr_length: 10
      factor: 3.0

    cci_filter:
      enabled: false
      length: 20
      overbought: 100
      oversold: -100

    adx_filter:
      enabled: false
      adx_length: 14
      threshold: 18.0

    macd_filter:
      enabled: false
      fast_length: 12
      slow_length: 26
      signal_length: 9

    ma_filter:
      enabled: false
      ma_type: "TEMA"
      length: 25
      slope_length: 10

    pivot_filter:
      enabled: false
      reversal_percent: 0.35
      order: 5

  default_error_strategy: "pass_through"


# -----------------------------------------------------------------------------
# [GENERIC] TRADE MANAGEMENT
# -----------------------------------------------------------------------------
trade_management:
  # Phase 5.4: Spread values removed - now exclusively from broker file
  spread:
    enabled: true
    # Path to broker spread definitions. All spread values come from this file.
    config_path: "configs/spreads/broker_spreads.yaml"

  risk:
    atr_length: 14
    atr_multiplier_sl: 1.4
    tp_mode: "rr_ratio"
    risk_to_reward_ratio: 6.7
    atr_multiplier_tp: 7.98
    max_risk_percentile: 0.23 #In % => 0.15 stands for 0.15% | 100 stands for 100% => max risk percentile disabled

  position_control:
    pyramiding_enabled: false
    close_on_opposite: false
    max_positions: 1


# -----------------------------------------------------------------------------
# [GENERIC] OUTPUT
# -----------------------------------------------------------------------------
output:
  reports:
    enabled: true
    output_dir: "outputs/strategies/reports/wbws"
    theme: "dark"           # "dark" | "light"
    chart_height_px: 300    # Valid range: 100–800
    brand_name: "WBWSStrategy"
    include_raw_data: true

  logging:
    level: "INFO"           # DEBUG | INFO | WARNING | ERROR
    output_dir: "outputs/strategies/logs/wbws"