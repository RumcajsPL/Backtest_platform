# =============================================================================
# WBWS Strategy — DAX; TF: 1min; HTF 1h 
# Date: 2026-03-06
# =============================================================================
asset:
  symbol: "DEUIDXEUR"
  pip_size: 0.1      
  point_size: 1.0
data:
  paths:
    strategy_ohlcv: "data/processed/ohlcv/DEUIDXEUR_1min_20221201_20260301.parquet"
    htf_ohlcv:      "data/processed/ohlcv/DEUIDXEUR_1h_20221201_20260301.parquet"
    ltf_ohlcv:      "data/processed/ohlcv/DEUIDXEUR_1s_20230101_20260301.parquet"
    artf_ohlcv:     "data/processed/ohlcv/DEUIDXEUR_1ME_20210101_20260301.parquet"
  date_range:
    start: "2025-09-15 08:30:00"
    end:   "2025-12-17 20:30:00" 
  timezone: "CET"
  htf_period: "1H"         
  ltf_timeframe: "1s"      
  artf_timeframe: "1ME"    
execution:
  mode: "core"
filters:
  time_filters:
    time_filter:
      enabled: true
      session_start: {hour: 08, minute: 30}
      session_end:   {hour: 20, minute: 30}    
  filter_sequence:
    - dpo_filter
    - bollinger_filter
    - choppiness_filter
    - rsi_filter
    - adx_filter
    - supertrend_filter
    - ma_filter
    - pivot_filter
    - cci_filter
    - macd_filter  
  technical_filters:
    rsi_filter:
      enabled: false
      length: 14
      overbought: 70
      oversold: 30
    dpo_filter:
      enabled: true
      length: 19
      smooth: 14
      threshold: 0.25
    bollinger_filter:
      enabled: true
      length: 11
      width_ma_length: 38
      filter_multiplier: 1
    choppiness_filter:
      enabled: true
      length: 16
      threshold: 58.8
    supertrend_filter:
      enabled: false
      atr_length: 10
      factor: 3.0
    cci_filter:
      enabled: false
      length: 20
      overbought: 100
      oversold: -100
    adx_filter:
      enabled: false
      adx_length: 14
      threshold: 18.0
    macd_filter:
      enabled: false
      fast_length: 12
      slow_length: 26
      signal_length: 9
    ma_filter:
      enabled: false
      ma_type: "TEMA"
      length: 25
      slope_length: 10
    pivot_filter:
      enabled: false
      reversal_percent: 0.35
      order: 5
  default_error_strategy: "pass_through"
trade_management:
  spread:
    enabled: true    
    config_path: "configs/spreads/broker_spreads.yaml"
  risk:
    atr_length: 9
    atr_multiplier_sl: 1.9
    tp_mode: "rr_ratio"
    risk_to_reward_ratio: 1.8
    atr_multiplier_tp: 7.98
    max_risk_percentile: 0.35
  position_control:
    pyramiding_enabled: false
    close_on_opposite: false
    max_positions: 1
output:
  reports:
    enabled: false
    output_dir: "outputs/strategies/reports/wbws"
    theme: "dark"
    chart_height_px: 300
    brand_name: "WBWSStrategy"
    include_raw_data: true
  logging:
    level: "INFO"
    output_dir: "outputs/strategies/logs/wbws"