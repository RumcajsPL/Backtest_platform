asset:
  pip_size: 0.1
  point_size: 1.0
  symbol: DEUIDXEUR
data:
  artf_timeframe: 1ME
  date_range:
    end: '2023-12-29 23:59:59'
    start: '2023-10-02 00:00:00'
  htf_period: 1H
  ltf_timeframe: 1s
  paths:
    artf_ohlcv: data/processed/ohlcv/DEUIDXEUR_1ME_20210101_20260301.parquet
    htf_ohlcv: data/processed/ohlcv/DEUIDXEUR_1h_20221201_20260301.parquet
    ltf_ohlcv: data/processed/ohlcv/DEUIDXEUR_1s_20230101_20260301.parquet
    strategy_ohlcv: data/processed/ohlcv/DEUIDXEUR_1min_20221201_20260301.parquet
  timezone: CET
execution:
  mode: core
filters:
  default_error_strategy: pass_through
  filter_sequence:
  - rsi_filter
  - choppiness_filter
  - bollinger_filter
  - adx_filter
  - supertrend_filter
  - ma_filter
  - pivot_filter
  - cci_filter
  - macd_filter
  - dpo_filter
  technical_filters:
    adx_filter:
      adx_length: 14
      enabled: false
      threshold: 18.0
    bollinger_filter:
      enabled: true
      filter_multiplier: 0.4
      length: 9
      width_ma_length: 21
    cci_filter:
      enabled: false
      length: 20
      overbought: 100
      oversold: -100
    choppiness_filter:
      enabled: true
      length: 14
      threshold: 61.8
    dpo_filter:
      enabled: true
      length: 20
      smooth: 3
      threshold: 0.2
    ma_filter:
      enabled: false
      length: 25
      ma_type: TEMA
      slope_length: 10
    macd_filter:
      enabled: false
      fast_length: 12
      signal_length: 9
      slow_length: 26
    pivot_filter:
      enabled: false
      order: 5
      reversal_percent: 0.35
    rsi_filter:
      enabled: true
      length: 10
      overbought: 57
      oversold: 30
    supertrend_filter:
      atr_length: 10
      enabled: false
      factor: 3.0
  time_filters:
    time_filter:
      enabled: true
      session_end:
        hour: 20
        minute: 30
      session_start:
        hour: 08
        minute: 30
output:
  logging:
    level: INFO
    output_dir: outputs/strategies/logs/wbws
  reports:
    brand_name: WBWSStrategy
    chart_height_px: 300
    enabled: false
    include_raw_data: true
    output_dir: outputs/strategies/reports/wbws
    theme: dark
trade_management:
  position_control:
    close_on_opposite: false
    max_positions: 1
    pyramiding_enabled: false
  risk:
    atr_length: 9
    atr_multiplier_sl: 2.3
    atr_multiplier_tp: 7.98
    max_risk_percentile: 0.33
    risk_to_reward_ratio: 7.1
    tp_mode: rr_ratio
  spread:
    config_path: configs/spreads/broker_spreads.yaml
    enabled: true
